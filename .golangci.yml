version: "2"

# Lint the integration tests too.
run:
  build-tags:
    - integration

linters:
  default: none
  enable:
    - bodyclose
    - errcheck
    - gosec
    - govet
    - ineffassign
    - revive
    - staticcheck
    - unused

formatters:
  enable:
    - gofumpt
  settings:
    gofumpt:
      module-path: github.com/damchi/sport-challenge-api
