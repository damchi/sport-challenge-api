name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to a pull request cancels its previous run; runs on main always finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Documentation-only changes (docs/, Markdown, .claude/) skip the four jobs
  # below: a skipped job counts as passed for the required checks of main, and
  # the Actions minutes of this private repository go to the code. They are
  # skipped only when this job succeeded and said code=false: if it fails or
  # says nothing, they run (a failed dependency would otherwise skip them, and
  # a skipped job passes).
  changes:
    name: what changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # both ends of the diff
          persist-credentials: false

      # bash -eo pipefail: a failure of the script fails the step, despite tee.
      - name: Diff
        id: diff
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: .github/scripts/code-changed.sh "$BASE" "$HEAD" | tee -a "$GITHUB_OUTPUT"

  check:
    name: fmt, lint, test
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code != 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # Pinned tools are installed into bin/ by the Makefile; their versions live there.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: bin
          key: tools-${{ runner.os }}-${{ hashFiles('go.mod', 'Makefile') }}

      - name: Format
        run: |
          make fmt
          git diff --exit-code

      - name: OpenAPI lint
        run: make openapi-lint

      # Fails when api/openapi.yaml and the generated code disagree.
      - name: Generated code is up to date
        run: |
          make generate
          git diff --exit-code
          test -z "$(git status --porcelain)"

      - name: Lint
        run: make lint

      # Fails on a known vulnerability that the code reaches; one published
      # after a merge breaks the next run, which then upgrades the module.
      - name: Vulnerabilities
        run: make vuln

      - name: Test
        run: make test

      # The rules that compute the version of a release (release.yml).
      - name: Release script
        run: .github/scripts/next-version_test.sh

      # The rules that decide what the deployment deploys (deploy.yml).
      - name: Deploy plan script
        run: |
          .github/scripts/plan-deploy_test.sh
          .github/scripts/newer-versions_test.sh

      # The rules that skip this CI and the release for documentation-only changes.
      - name: Changed files scripts
        run: |
          .github/scripts/code-changed_test.sh
          .github/scripts/release-needed_test.sh

  migrations:
    name: migrations up, down, up
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code != 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sport
          POSTGRES_PASSWORD: sport
          POSTGRES_DB: sport_challenge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sport -d sport_challenge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Throwaway CI database, same credentials as the local compose (not secrets).
      DATABASE_URL: postgres://sport:sport@localhost:5432/sport_challenge?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: bin
          key: tools-${{ runner.os }}-${{ hashFiles('go.mod', 'Makefile') }}

      - name: Up
        run: make migrate-up

      # Rolls back every migration, one at a time, then proves the down files
      # left nothing behind (only golang-migrate's own table may remain).
      - name: Down to empty
        run: |
          for _ in migrations/*.up.sql; do
            make migrate-down
          done
          tables=$(psql "$DATABASE_URL" -tAc "SELECT count(*) FROM pg_tables WHERE schemaname = 'public' AND tablename <> 'schema_migrations'")
          functions=$(psql "$DATABASE_URL" -tAc "SELECT count(*) FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace WHERE n.nspname = 'public'")
          echo "tables=$tables functions=$functions"
          test "$tables" = 0 && test "$functions" = 0

      - name: Up again
        run: |
          make migrate-up
          make migrate-version

  integration:
    name: integration tests
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code != 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sport
          POSTGRES_PASSWORD: sport
          POSTGRES_DB: sport_challenge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sport -d sport_challenge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Throwaway CI server; each test creates and drops its own database.
      TEST_DATABASE_URL: postgres://sport:sport@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Integration tests
        run: make test-integration

  image:
    name: docker image
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code != 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The API starts against a database (its /health is read below).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sport
          POSTGRES_PASSWORD: sport
          POSTGRES_DB: sport_challenge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sport -d sport_challenge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The build facts go through the image: the version and the commit are
      # given here as the release workflow gives them.
      - name: Build
        run: make docker-build VERSION=v0.0.0-ci COMMIT="$GITHUB_SHA"

      # The three commands start in the minimal image, as a non-root user. Without
      # configuration each one must fail on its own message, not on a missing
      # binary or library.
      - name: Smoke test
        run: |
          test "$(docker image inspect -f '{{.Config.User}}' sport-challenge-api:local)" = "nonroot:nonroot"
          timeout 30 docker run --rm sport-challenge-api:local 2>&1 | tee api.log || true
          grep -q "PORT is required" api.log
          timeout 30 docker run --rm sport-challenge-api:local worker 2>&1 | tee worker.log || true
          grep -q "usage: worker" worker.log
          timeout 30 docker run --rm sport-challenge-api:local migrate up 2>&1 | tee migrate.log || true
          grep -q "DATABASE_URL is required" migrate.log

      # The linker flags reach the binary: the running API tells its version and
      # commit on /health (no token), and the image carries them as labels.
      - name: Build info
        run: |
          test "$(docker image inspect -f '{{index .Config.Labels "org.opencontainers.image.revision"}}' sport-challenge-api:local)" = "$GITHUB_SHA"
          container=$(docker run -d --network host \
            -e ENV=local -e PORT=8080 -e LOG_LEVEL=info \
            -e DATABASE_URL='postgres://sport:sport@127.0.0.1:5432/sport_challenge?sslmode=disable' \
            -e AUTH0_DOMAIN=ci.invalid -e AUTH0_AUDIENCE=https://api.test \
            -e AUTH0_MGMT_CLIENT_ID=ci -e AUTH0_MGMT_CLIENT_SECRET=ci \
            sport-challenge-api:local)
          # Whatever happens next, show what the API said and remove it.
          trap 'docker logs "$container" 2>&1 | tail -n 20; docker rm -f "$container" >/dev/null' EXIT
          for _ in $(seq 1 30); do curl -sf http://127.0.0.1:8080/health -o health.json && break; sleep 1; done
          cat health.json
          docker logs "$container" 2>&1 | grep '"server started"' | grep -q "\"commit\":\"$GITHUB_SHA\""
          grep -q "\"commit\":\"$GITHUB_SHA\"" health.json
          grep -q '"version":"v0.0.0-ci"' health.json
