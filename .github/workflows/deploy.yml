name: Deploy

# Staging follows the `staging` branch: once its CI is green, its tip is
# deployed to staging. Production follows `main` (the promotion pull request
# from staging): once the Release run has finished (so the CI is green and the
# commit has its version tag), that version is deployed to production, after
# the approval of the `production` GitHub Environment. A rollback redeploys an
# older commit by hand. See docs/deploiement.md.
#
# A workflow_run workflow always runs from the default branch (main), whatever
# the branch of the run that triggered it: the deployment code is always main's.
#
# Terraform is never run here: the infrastructure is applied on explicit request.
on:
  workflow_run:
    workflows: [CI, Release]
    types: [completed]
    branches: [main, staging]
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to roll back
        type: choice
        options: [staging, production]
        required: true
      ref:
        description: Version tag or commit SHA to redeploy (its image must still be in Artifact Registry)
        type: string
        required: true

permissions:
  contents: read

jobs:
  plan:
    name: what to deploy
    # Only a push to staging (its CI) or to main (its release) of this
    # repository, never a pull request; the CI of main is followed by the
    # release, which is what goes to production.
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        ((github.event.workflow_run.name == 'CI' && github.event.workflow_run.head_branch == 'staging') ||
         (github.event.workflow_run.name == 'Release' && github.event.workflow_run.head_branch == 'main'))))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.plan.outputs.sha }}
      version: ${{ steps.plan.outputs.version }}
      rollback: ${{ steps.plan.outputs.rollback }}
      staging: ${{ steps.plan.outputs.staging }}
      production: ${{ steps.plan.outputs.production }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0 # the history and the tags
          persist-credentials: false

      # The rules are in a script of their own, tested by the CI.
      - name: Plan
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          WORKFLOW: ${{ github.event.workflow_run.name }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          TARGET: ${{ inputs.environment }}
          REF: ${{ inputs.ref }}
        run: |
          .github/scripts/plan-deploy.sh | tee -a "$GITHUB_OUTPUT"

  # Opt-in per repository (Settings > Secrets and variables > Actions > Variables):
  # DEPLOY_STAGING and DEPLOY_PRODUCTION are set to "true" once the environment
  # exists, so that a merge does not fail before then.
  staging:
    name: staging
    needs: plan
    if: >-
      github.ref == 'refs/heads/main' && needs.plan.outputs.staging == 'true' &&
      vars.DEPLOY_STAGING == 'true'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy-environment.yml
    with:
      environment: staging
      sha: ${{ needs.plan.outputs.sha }}
      version: ${{ needs.plan.outputs.version }}
      rollback: ${{ needs.plan.outputs.rollback }}

  production:
    name: production
    needs: plan
    # Required reviewers are set on the production Environment: the job waits
    # for them.
    if: >-
      github.ref == 'refs/heads/main' && needs.plan.outputs.production == 'true' &&
      vars.DEPLOY_PRODUCTION == 'true'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy-environment.yml
    with:
      environment: production
      sha: ${{ needs.plan.outputs.sha }}
      version: ${{ needs.plan.outputs.version }}
      rollback: ${{ needs.plan.outputs.rollback }}
