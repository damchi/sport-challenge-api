name: Deploy

# Once a release run has finished on main (so the CI is green), the tip of main
# is deployed to staging; when it also got a version tag, it is then deployed
# to production, after the approval of the `production` GitHub Environment.
# A rollback redeploys an older commit by hand. See docs/deploiement.md.
#
# Terraform is never run here: the infrastructure is applied on explicit request.
on:
  workflow_run:
    workflows: [Release]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to roll back
        type: choice
        options: [staging, production]
        required: true
      ref:
        description: Version tag or commit SHA to redeploy (its image must still be in Artifact Registry)
        type: string
        required: true

permissions:
  contents: read

jobs:
  plan:
    name: what to deploy
    # Only a run on main of this repository, never a pull request.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.plan.outputs.sha }}
      version: ${{ steps.plan.outputs.version }}
      rollback: ${{ steps.plan.outputs.rollback }}
      staging: ${{ steps.plan.outputs.staging }}
      production: ${{ steps.plan.outputs.production }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0 # the history and the tags
          persist-credentials: false

      - name: Plan
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          TARGET: ${{ inputs.environment }}
          REF: ${{ inputs.ref }}
        run: |
          staging=false
          production=false
          rollback=false
          if [ "$EVENT" = workflow_dispatch ]; then
            rollback=true
            case "$REF" in -*) echo "::error::invalid ref"; exit 1 ;; esac
            sha=$(git rev-parse --verify "$REF^{commit}")
            # Only what was merged into main is ever deployed.
            git merge-base --is-ancestor "$sha" origin/main || { echo "::error::$REF is not in main"; exit 1; }
            if [ "$TARGET" = production ]; then production=true; else staging=true; fi
          else
            sha=$HEAD_SHA
            # Runs can arrive late: only the tip of main is deployed.
            if [ "$sha" != "$(git rev-parse origin/main)" ]; then
              echo "$sha is no longer the tip of main: left to the run of the newer commit"
            else
              staging=true
              # A version tag on the commit: the release goes on to production.
              if [ -n "$(git tag --points-at "$sha" --list 'v[0-9]*')" ]; then production=true; fi
            fi
          fi
          version=$(git tag --points-at "$sha" --list 'v[0-9]*' | sort -V | tail -n 1)
          # Between two releases: the last version, the commits since, the commit.
          [ -n "$version" ] || version=$(git describe --tags --match 'v[0-9]*' --always "$sha")
          # A repository without any tag: git describe gives the bare commit.
          case "$version" in v*) ;; *) version=v0.0.0-$version ;; esac
          echo "sha=$sha version=$version rollback=$rollback staging=$staging production=$production"
          {
            echo "sha=$sha"
            echo "version=$version"
            echo "rollback=$rollback"
            echo "staging=$staging"
            echo "production=$production"
          } >> "$GITHUB_OUTPUT"

  # Opt-in per repository (Settings > Secrets and variables > Actions > Variables):
  # DEPLOY_STAGING and DEPLOY_PRODUCTION are set to "true" once the environment
  # exists, so that a merge does not fail before then.
  staging:
    name: staging
    needs: plan
    if: needs.plan.outputs.staging == 'true' && vars.DEPLOY_STAGING == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging
    # One deployment at a time, and a running one is never cancelled.
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write # the OIDC token exchanged for GCP credentials
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - uses: ./.github/actions/deploy
        with:
          project: ${{ vars.GCP_PROJECT_ID }}
          region: ${{ vars.GCP_REGION }}
          workload-identity-provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service-account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          sha: ${{ needs.plan.outputs.sha }}
          version: ${{ needs.plan.outputs.version }}
          rollback: ${{ needs.plan.outputs.rollback }}

  production:
    name: production
    needs: [plan, staging]
    # After a staging that succeeded (a rollback has no staging step).
    if: >-
      !cancelled() && needs.plan.outputs.production == 'true' &&
      vars.DEPLOY_PRODUCTION == 'true' &&
      (needs.staging.result == 'success' ||
       (needs.plan.outputs.rollback == 'true' && needs.staging.result == 'skipped'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Required reviewers are set on this Environment: the job waits for them.
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - uses: ./.github/actions/deploy
        with:
          project: ${{ vars.GCP_PROJECT_ID }}
          region: ${{ vars.GCP_REGION }}
          workload-identity-provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service-account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          sha: ${{ needs.plan.outputs.sha }}
          version: ${{ needs.plan.outputs.version }}
          rollback: ${{ needs.plan.outputs.rollback }}
