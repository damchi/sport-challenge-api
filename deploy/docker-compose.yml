# Local development only. Credentials below are not secrets.
name: sport-challenge-api

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sport
      POSTGRES_PASSWORD: sport
      POSTGRES_DB: sport_challenge
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sport -d sport_challenge"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
