openapi: 3.0.3
info:
  title: Sport Challenge API
  version: 0.1.0
  description: |
    Backend of the Sport Challenge app. This file is the source of truth:
    change it first, then run `make generate`.

    Health endpoints live at the root; business routes live under `/api/v1`.

    Every route requires an Auth0 access token (`bearerAuth`), declared once
    below: a new route is protected without adding anything. Only the health
    probes opt out with `security: []`.

    A blocked account (README §2.12) answers 403 `account_blocked` on every
    protected route but `DELETE /api/v1/me`, which stays open to it: this
    answer is not repeated on each operation. The apps show a "blocked
    account" page, from which the account can still be deleted.

    Every response, errors included, carries `X-Content-Type-Options: nosniff`
    and `Cache-Control: no-store` (the responses hold personal data). A route
    whose response can be kept declares its own `Cache-Control`, which
    replaces it (`GET /api/v1/sports`).
  license:
    name: Proprietary
    url: https://github.com/damchi/sport-challenge-api
servers:
  - url: /
security:
  - bearerAuth: []
tags:
  - name: health
    description: Liveness and readiness probes.
  - name: me
    description: Profile of the authenticated user.
  - name: sports
    description: Catalogue of sports.
  - name: challenges
    description: Challenges, their categories and participants.
  - name: activities
    description: Activities of the user, entered once and counted in every challenge where they belong.
  - name: invitations
    description: Invitation links to a challenge, reusable until the end of week 1.
  - name: admin
    description: |
      Administration of the app (README §2.12), for the accounts with the
      `admin` permission of their access token. Without it, every `/admin`
      route answers 404 `not_found`, as if it did not exist.
paths:
  /health:
    get:
      operationId: getHealth
      summary: Liveness probe
      description: |
        Always returns 200 while the process is able to serve requests. It also
        tells which build runs (version and commit), so that a deployment can
        be checked without a token. No trailing "z" (as in /healthz): Cloud Run
        reserves some paths ending in z and answers them itself.
      tags: [health]
      security: []
      responses:
        "200":
          description: The process is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "429":
          $ref: "#/components/responses/RateLimited"
  /ready:
    get:
      operationId: getReady
      summary: Readiness probe
      description: Returns 200 when the database answers, 503 otherwise.
      tags: [health]
      security: []
      responses:
        "200":
          description: The API can serve traffic.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
              example:
                status: ok
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          description: A dependency (the database) does not answer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
              example:
                status: unavailable
  /api/v1/me:
    get:
      operationId: getMe
      summary: Read my profile
      description: |
        Profile of the authenticated user, created empty on first login. The
        profile is complete once the first name and the last name are set, with
        or without a pseudo: creating or joining a challenge and recording an
        activity require it (`profile_incomplete`). The e-mail comes from the access token and is
        only ever returned here, to its owner.
      tags: [me]
      responses:
        "200":
          description: The profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
    patch:
      operationId: patchMe
      summary: Update my profile
      description: |
        Changes the pseudo, the first name, the last name and the language.
        An absent field is left unchanged. `pseudo: null` removes the pseudo,
        which is optional; `null` is refused for the other fields (the first
        name, the last name and the language can be changed, never removed).
        The e-mail is not editable: it comes from the auth provider.
      tags: [me]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MeUpdate"
      responses:
        "200":
          description: The updated profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: |
            The pseudo is already taken, regardless of case
            (`validation_failed`, `params.fields` = `pseudo`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      operationId: deleteMe
      summary: Delete my account
      description: |
        Final: the account is anonymized (pseudo, first name, last name,
        e-mail, avatar and language erased) and every row tied to it is erased, in
        every challenge, finished ones included: its activities,
        participations, eliminations, creator roles, its entries in the
        frozen results (the others move up) and its invitation links
        (people who already joined through them stay participants). The
        challenges it created stay. A failure erases nothing. The user is
        also deleted at the auth provider. Every later request with a token of this account, even
        one still valid, answers 401 `account_deleted`; logging in again
        with this identity never creates a new account. The client asks for confirmation first.
        A 500 may come after the account is deleted: retrying then answers
        401 `account_deleted`, which the client treats as done.
        Refused (422 `last_creator`) while the account is the last creator
        with an account of a challenge not finished: the user first adds
        another creator, or deletes the challenge; `params.challenges` lists
        their ids, comma-separated. Nothing is deleted then.
        Open to a blocked account (README §2.12), by the same path: the
        only route it may still call.
      tags: [me]
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          description: |
            The account is the last creator of challenges not finished
            (`last_creator`); `params.challenges` lists them.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/me/activities:
    get:
      operationId: listMyActivities
      summary: List my activities
      description: |
        The activities of the authenticated user, deleted ones left out,
        most recent first (`started_at`, then `id`). `from` and `to` keep
        those started in `[from, to)`; `to` must come after `from`; `sport`
        those of one sport. Each one
        lists the challenges where it counts now and whether it is `locked`
        (its week is locked in one of them: 7 am, local time of that
        challenge, on the first day of the next week, the day of its
        `week_ends_at`).
      tags: [activities]
      parameters:
        - $ref: "#/components/parameters/SportFilter"
        - name: from
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: cursor
          in: query
          description: The `next_cursor` of the previous page, as is.
          schema:
            type: string
            maxLength: 200
      responses:
        "200":
          description: A page of activities.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityPage"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/me/activities/summary:
    get:
      operationId: getMyActivitySummary
      summary: Summarize my activities
      description: |
        Totals of the activities of the authenticated user, deleted ones left
        out, whether they count in a challenge or not: those of the current
        week, day by day, the number of activities of each sport, their total
        duration, and the number of challenges joined. A week
        runs from Monday 00:00 to the next Monday 00:00 in `tz` (the first
        instant of the day where a time change skips midnight), so it can last
        167 or 169 hours; it is not the week of a challenge.
      tags: [activities]
      parameters:
        - $ref: "#/components/parameters/TimeZone"
      responses:
        "200":
          description: The summary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivitySummary"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/me/activities/weeks:
    get:
      operationId: listMyActivityWeeks
      summary: List the totals of my weeks
      description: |
        The weeks with at least one activity of the authenticated user
        (deleted ones left out; of `sport` only, when given), most recent
        first, with their totals. Weeks are cut as in
        `GET /api/v1/me/activities/summary`.
      tags: [activities]
      parameters:
        - $ref: "#/components/parameters/TimeZone"
        - $ref: "#/components/parameters/SportFilter"
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: cursor
          in: query
          description: The `next_cursor` of the previous page, as is.
          schema:
            type: string
            maxLength: 200
      responses:
        "200":
          description: A page of weeks.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityWeekPage"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/sports:
    get:
      operationId: getSports
      summary: List the sports
      description: |
        Catalogue of sports, sorted by code, with the exercises of each. The
        apps translate the codes and prefill the distance factors of the
        challenge creation form with the suggested ones; the creator may
        change them.
      tags: [sports]
      responses:
        "200":
          description: The catalogue.
          headers:
            Cache-Control:
              description: The catalogue rarely changes; private because the request is authenticated.
              required: true
              schema:
                type: string
                example: private, max-age=300
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SportList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/challenges:
    get:
      operationId: listChallenges
      summary: List challenges
      description: |
        `public`: the public challenges; `mine`: those the user created or
        joined (abandoned included). Deleted challenges never appear, and a
        private challenge never appears in `public`. The status, filter
        and field alike, is computed from the current instant. Upcoming and
        ongoing challenges come soonest first, finished ones most recent
        first; without a status filter, by start date.

        In `mine`, `my_week` gives where the user stands in each ongoing
        challenge they take part in: their lines of the leaderboard
        (`GET /challenges/{challengeId}/leaderboard`), computed at the
        instant the status is; `best_result` gives their best frozen rank in
        each finished one.

        `counts` gives how many challenges of the scope have each status,
        whatever the `status` filter: the same on every page.
      tags: [challenges]
      parameters:
        - name: scope
          in: query
          schema:
            type: string
            enum: [public, mine]
            default: public
        - name: status
          in: query
          schema:
            type: string
            enum: [upcoming, ongoing, finished]
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: cursor
          in: query
          description: The `next_cursor` of the previous page, as is.
          schema:
            type: string
            maxLength: 200
      responses:
        "200":
          description: A page of challenges.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChallengePage"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: createChallenge
      summary: Create a challenge
      description: |
        Creates a challenge with its categories: the cumulative time always,
        the cumulative distance, the elimination and the points when chosen
        in `categories`; the creator becomes its first participant. Requires a
        complete profile (`profile_incomplete`).
        The window starts at local midnight of `start_date` in `timezone` and
        lasts `weeks` local weeks. Distance factors not given keep the
        catalogue's suggested factor brought back to `reference_sport`; all
        are frozen at creation, like the reference sport.
      tags: [challenges]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChallengeCreate"
      responses:
        "201":
          description: The created challenge.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Challenge"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          description: The profile is incomplete (`profile_incomplete`); set the first name and last name first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/challenges/{challengeId}:
    get:
      operationId: getChallenge
      summary: Read a challenge
      description: |
        The challenge, its categories, the user's role and participation,
        and fields computed by the server from the current instant. A
        challenge that does not exist, was deleted, or is private and not
        visible to the user answers the same 404 `challenge_not_found`.
        An admin (permission `admin` of the access token) sees every
        challenge not deleted; `my_role` and `can_join` stay those of their
        own membership: this route gives them no write.
      tags: [challenges]
      parameters:
        - name: challengeId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The challenge.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChallengeDetail"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/ChallengeNotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      operationId: deleteChallenge
      summary: Delete a challenge
      description: |
        Creators only (403 `forbidden`), at any time, even ongoing or
        finished. The challenge disappears at once for everyone, its creators
        included (404 from then on); its data stays until the final purge.
        Deleting it again answers 404, like a missing challenge.
      tags: [challenges]
      parameters:
        - name: challengeId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Deleted.
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/ChallengeNotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
    patch:
      operationId: updateChallenge
      summary: Edit the title and the description
      description: |
        Creators only (403 `forbidden`), at any time, even after the start.
        Only `title` and `description` change; every other field of the
        challenge is frozen at creation and answers 422 `field_not_editable`
        with the fields in `params.fields`. An absent field is left as is;
        an empty `description` removes it. `null` is refused for `title` and
        `description`, and a frozen field sent as `null` answers 400
        `validation_failed` with the field in `params.fields`.
      tags: [challenges]
      parameters:
        - name: challengeId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChallengeUpdate"
      responses:
        "200":
          description: The challenge after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChallengeDetail"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/ChallengeNotFound"
        "422":
          description: A field frozen at creation was sent (`field_not_editable`, `params.fields`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/challenges/{challengeId}/join:
    post:
      operationId: joinChallenge
      summary: Join a challenge
      description: |
        Makes the user an active participant, ranked in every category.
        Open until the end of week 1 (`registration_closed` from that exact
        instant); a public challenge to every logged-in user, a private one
        on invitation (otherwise the same 404 as a missing challenge). Never
        twice: `already_participant`, or `participation_abandoned` after an
        abandon, which is final. Requires a complete profile
        (`profile_incomplete`).
      tags: [challenges]
      parameters:
        - name: challengeId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "201":
          description: Joined; the challenge as the user now sees it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChallengeDetail"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/ChallengeNotFound"
        "409":
          description: Already a participant (`already_participant`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: |
            Registration closed after week 1 (`registration_closed`), abandoned
            for good (`participation_abandoned`), or incomplete profile
            (`profile_incomplete`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/challenges/{challengeId}/abandon:
    post:
      operationId: abandonChallenge
      summary: Abandon a challenge
      description: |
        Ends the user's participation for good: eliminated from every
        category, shown as abandoned, never able to join again. A creator
        keeps the creator rights but no longer competes. Abandoning again
        answers 200 and changes nothing. A finished challenge answers 422
        `challenge_ended`; a visible challenge the user never joined answers
        404 `not_found`, a hidden one the same 404 `challenge_not_found` as a
        missing challenge.
      tags: [challenges]
      parameters:
        - name: challengeId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Abandoned; the challenge as the user now sees it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChallengeDetail"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: |
            No participation to abandon (`not_found`), or a missing, deleted or
            hidden challenge (`challenge_not_found`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: The challenge is finished (`challenge_ended`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/challenges/{challengeId}/participants:
    get:
      operationId: listParticipants
      summary: List the participants
      description: |
        Visible to whoever sees the challenge: every user for a public one;
        its creators, participants (abandoned included), invited users and
        admins (permission `admin` of the access token) for a private one.
        Anyone else, like a missing or deleted challenge, gets the same 404
        `challenge_not_found`. Every participant is listed,
        abandoned or excluded ones included (shown as abandoned), in order
        of registration; a deleted account is not listed at all.
      tags: [challenges]
      parameters:
        - name: challengeId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: cursor
          in: query
          description: The `next_cursor` of the previous page, as is.
          schema:
            type: string
            maxLength: 200
      responses:
        "200":
          description: A page of participants.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParticipantPage"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/ChallengeNotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/challenges/{challengeId}/leaderboard:
    get:
      operationId: getLeaderboard
      summary: Get the leaderboard
      description: |
        The ranking of each category of the challenge, always computed from the
        raw activities at `computed_at`. Visible to whoever sees the
        challenge: every user for a public one (a non-participant sees the
        ranking only); its creators, participants (abandoned included),
        invited users and admins (permission `admin` of the access token)
        for a private one. Anyone else, like a missing or deleted challenge,
        gets the same 404 `challenge_not_found`.

        Equal values share a rank (1, 1, 3). Participants who abandoned
        (also the excluded) are listed last in every category, with
        `abandoned` true and no rank nor value. A deleted account is not
        listed at all, even in a finished challenge: the others move up, the
        equal ones still sharing a rank.

        In the `elimination` category, `elimination` gives the live situation: the
        survivors first by distance, then the eliminated, the last
        eliminated first. `status` is `reached` once the distance of the
        week reaches the minimum, else `at_risk` when the end of the week is
        at most the configured threshold (24 h by default) away, else
        `in_progress`; `eliminated` once eliminated. There is no minimum and
        no status in week 1, nor outside the weeks of the challenge. A week
        is judged when it locks, at 7 am on the first day of the next week
        (the day of `week_ends_at`): until
        then nobody is eliminated for it, and the minimum of the current
        week may still rise.

        In the `points` category, `value` is the points acquired: those of
        the weeks locked (7 am on the first day of the next week), the rank
        being on them alone. `provisional_points` gives apart the points of
        the weeks started but not locked yet, computed the same way from the
        activities of the moment; null once every started week is locked,
        and in the frozen results.

        Pagination after the podium (the apps show 10, 50 or every line, the
        podium always). Without `limit`, every category comes whole in
        `entries`, `podium` and `next_cursor` null. With `limit`, each
        category gives its `podium` (ranks 1 to 3, equal ones included, so
        possibly more than 3 lines; never a value of 0, so empty while
        nobody has scored), then in `entries` up to `limit` lines
        after it (ranked ones, then those who abandoned), and `next_cursor`
        for the rest, null at the end. The next page of a category is asked
        with `category`, the same `limit` or another, and `cursor`: it gives
        that category alone, its podium again. `category` alone gives that
        category alone. Only a null `next_cursor` ends a list. In every
        case, `me` is the line of the user in the category, wherever it is,
        null when they are not a participant.

        The cursor holds the position in the ranking and its state: when the
        ranking of the category has changed since (an activity entered, a
        week locked…), the cursor answers 400 `cursor_invalid` and the client
        starts again from the first page.
      tags: [challenges]
      parameters:
        - name: challengeId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: category
          in: query
          description: |
            The category to answer alone; it must be one of the challenge
            (otherwise 400 `validation_failed` on `category`). Required with
            `cursor`, and the category of the cursor.
          schema:
            type: string
            enum: [cumulative_time, cumulative_distance, elimination, points, cumulative_elevation]
        - name: limit
          in: query
          description: How many lines after the podium; without, every line. Required with `cursor`.
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - name: cursor
          in: query
          description: The `next_cursor` of the previous page of the category, as is.
          schema:
            type: string
            maxLength: 200
      responses:
        "200":
          description: The leaderboard.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Leaderboard"
        "400":
          description: |
            The request does not match the contract (`validation_failed`,
            `params.fields` listing `category`, `limit` or `cursor`), or the
            ranking of the category changed since the cursor was given
            (`cursor_invalid`: start again from the first page).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/ChallengeNotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/challenges/{challengeId}/participants/{userId}:
    delete:
      operationId: excludeParticipant
      summary: Exclude a participant
      description: |
        Creators only (403 `forbidden`). The participant is eliminated from
        every category for good and shown as abandoned, with no mention of
        the exclusion. A creator cannot be excluded, even one who abandoned
        (422 `cannot_exclude_creator`); a finished challenge answers 422
        `challenge_ended`; excluding a participant already out answers 204
        and changes nothing; a user who never joined, or a deleted account,
        answers 404 `not_found`.
      tags: [challenges]
      parameters:
        - name: challengeId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Excluded (or already out).
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: |
            No such participant (`not_found`), or a missing, deleted or hidden
            challenge (`challenge_not_found`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: The target is a creator (`cannot_exclude_creator`), or the challenge is finished (`challenge_ended`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/challenges/{challengeId}/participants/{userId}/activities:
    get:
      operationId: listParticipantActivities
      summary: List the activities of a participant
      description: |
        The activities of participant `userId` started in the window of the
        challenge, deleted ones left out, most recent first (`started_at`,
        then `id`). Visible to the participants of the challenge (abandoned
        or excluded ones included), its creators and the admins (permission
        `admin` of the access token), on every challenge not deleted. A
        challenge the user may not see answers 404 `challenge_not_found`; a
        visible one the user never joined (a public challenge shows them its
        leaderboard only), or a `userId` who never joined it or whose account
        was deleted, answers 404 `not_found`.
        `contributions` and `locked` are read from this challenge only, never
        from the other challenges of the participant: `contributions` holds
        it when the activity counts in it (never for a participant who
        abandoned: empty), and `locked` is true once its week is locked in
        it (7 am, local time of the challenge, on the first day of the next
        week), where it counts; for a participant who abandoned, only when
        the week was already locked when they left. The
        author's own listing (`/me/activities`) may still show an activity
        locked by another challenge.
      tags: [activities]
      parameters:
        - name: challengeId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: cursor
          in: query
          description: The `next_cursor` of the previous page, as is.
          schema:
            type: string
            maxLength: 200
      responses:
        "200":
          description: A page of activities.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityPage"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: |
            A missing, deleted or hidden challenge (`challenge_not_found`), or
            an actor or a `userId` who never joined it, or a deleted account
            (`not_found`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/challenges/{challengeId}/participants/{userId}/points:
    get:
      operationId: getParticipantPoints
      summary: Get where the points of a participant come from
      description: |
        The points of participant `userId` in the `points` category, week by
        week and criterion by criterion (README §2.3), computed as the
        leaderboard at `computed_at`: the points of the locked weeks sum to
        the `value` of the leaderboard, those of the weeks started but not
        locked yet to its `provisional_points`. Every week started, in
        order; for a participant who abandoned (or was excluded), only the
        weeks locked by the time they left, as in the leaderboard. Once the
        results are frozen, the breakdown is the frozen one, every week
        locked.

        Visible to whoever sees the leaderboard of the challenge, for any of
        its participants; the `value` of each criterion only to those who see
        the activities of the participants (its participants, abandoned ones
        included, its creators and the admins), null for the others (a
        non-participant of a public challenge, an invited user). A challenge the user may not see answers 404
        `challenge_not_found`; a challenge without a `points` category, a
        `userId` who never joined it or whose account was deleted, 404
        `not_found`.
      tags: [challenges]
      parameters:
        - name: challengeId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The points of the participant.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PointsBreakdown"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: |
            No such challenge, or one the user may not see
            (`challenge_not_found`); no `points` category, or no such
            participant (`not_found`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/challenges/{challengeId}/activities:
    get:
      operationId: listChallengeActivities
      summary: List the activities of all the participants
      description: |
        The activities of every participant of the challenge (abandoned or
        excluded ones included) started in its window, deleted ones left
        out, most recent first (`started_at`, then `id`), each with its
        author. A deleted account is never listed, nor are its activities.
        Visible to the participants of the challenge (abandoned or excluded
        ones included), its creators and the admins (permission `admin` of
        the access token), as the list of a participant
        (`listParticipantActivities`). A challenge the user may not see
        answers 404 `challenge_not_found`; a visible one the user never
        joined (a public challenge shows them its leaderboard only)
        answers 404 `not_found`.
        `contributions` and `locked` are those of the list of the author
        (`listParticipantActivities`): read from this challenge only, never
        from the other challenges of the author; `contributions` is empty
        for a participant who abandoned.
        A page may hold fewer than `limit` items (an account deleted while
        it was read) and still have a `next_cursor`: only a null
        `next_cursor` ends the list.
      tags: [activities]
      parameters:
        - name: challengeId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: cursor
          in: query
          description: The `next_cursor` of the previous page, as is.
          schema:
            type: string
            maxLength: 200
      responses:
        "200":
          description: A page of activities with their authors.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChallengeActivityPage"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: |
            A missing, deleted or hidden challenge (`challenge_not_found`), or
            an actor who never joined it (`not_found`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/challenges/{challengeId}/creators:
    post:
      operationId: addCreator
      summary: Add a creator
      description: |
        Creators only (403 `forbidden`). The target must be an active
        participant (422 `not_active_participant`): every creator is a
        participant, and a deleted account is none, even one that was a
        creator. Adding an existing creator answers 200 and changes
        nothing. A finished challenge answers 422 `challenge_ended`.
      tags: [challenges]
      parameters:
        - name: challengeId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatorAdd"
      responses:
        "200":
          description: The target is a creator; the challenge as the user sees it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChallengeDetail"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/ChallengeNotFound"
        "422":
          description: The target is not an active participant (`not_active_participant`), or the challenge is finished (`challenge_ended`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/challenges/{challengeId}/invitations:
    post:
      operationId: createInvitation
      summary: Create an invitation link
      description: |
        Creates a link to the challenge, reusable by several people until
        the end of week 1. Creators, and active participants when the
        challenge was created with `members_can_invite` (otherwise 403
        `forbidden`); nobody from the end of week 1 (422
        `registration_closed`). The token is answered here only: the server
        keeps its hash.
      tags: [invitations]
      parameters:
        - name: challengeId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "201":
          description: The invitation, with its token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationCreated"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/ChallengeNotFound"
        "422":
          description: Registration closed after week 1 (`registration_closed`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/invitations/open:
    post:
      operationId: openInvitation
      summary: Open an invitation link
      description: |
        A limited preview of the challenge of the invitation whose token is
        in the body (never in the URL: the logs of the platform record the
        URLs). Opening the link makes the user invited: while the invitation
        is valid, they read the challenge (`GET /challenges/{challengeId}`)
        and may join it. Opening it again changes nothing. An unknown or
        malformed token, an expired or revoked invitation, one whose author
        may no longer invite (or whose account is deleted), and one to a
        deleted challenge answer the same 404 `invitation_invalid`.
      tags: [invitations]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvitationTokenRequest"
      responses:
        "200":
          description: The preview of the challenge.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationPreview"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/InvitationInvalid"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/invitations/accept:
    post:
      operationId: acceptInvitation
      summary: Accept an invitation
      description: |
        Opens the link whose token is in the body, then joins its challenge
        under the rules of `POST /challenges/{challengeId}/join`: never twice
        (`already_participant`), never after an abandon
        (`participation_abandoned`), with a complete profile
        (`profile_incomplete`). An invitation expires at the end of week 1,
        when joining closes: from that instant the answer is 404
        `invitation_invalid`, as for every invalid token.
      tags: [invitations]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvitationTokenRequest"
      responses:
        "201":
          description: Joined; the challenge as the user now sees it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChallengeDetail"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/InvitationInvalid"
        "409":
          description: Already a participant (`already_participant`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: |
            Abandoned for good (`participation_abandoned`), incomplete profile
            (`profile_incomplete`), or registration closed while accepting
            (`registration_closed`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/activities:
    post:
      operationId: createActivity
      summary: Record an activity
      description: |
        Records a manual activity of the authenticated user, who needs a
        complete profile (`profile_incomplete`). It belongs to the user, not
        to a challenge: it counts in every challenge, not deleted, where the
        user is an active participant and whose window holds `started_at`
        (`contributions`, possibly empty). An activity outside every window
        is recorded all the same. It counts wholly for the week it starts in,
        even when it ends in the next one. It is refused (`week_locked`) when
        its week is locked in one of those challenges, finished ones
        included: a week locks at 7 am, local time of the challenge, on the
        first day of the next week (the day of `week_ends_at`; the last one
        on the day of the challenge's `ends_at`). A challenge the user left
        (abandoned or excluded) still locks the weeks already locked when
        they left: their points there no longer move. Its end
        (`started_at` plus `duration_seconds`) is never in the future (5
        minutes of tolerance) and `started_at` never before 2000-01-01
        (`validation_failed`). It never overlaps another activity of the user
        (`activity_overlap`); activities one after the other (a triathlon)
        are fine, the end of one being the start of the next. The
        speed is computed, never sent. With `Idempotency-Key`, a valid
        request sent again with the same key answers 200 with the activity
        recorded first, as it is now (replaced since, maybe), even if the
        body differs; once that activity is deleted, it answers 404
        `activity_not_found` and records nothing.
      tags: [activities]
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: Key chosen by the client (a UUID, for instance), unique per user.
          schema:
            type: string
            pattern: "^[!-~]{1,128}$"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActivityCreate"
      responses:
        "201":
          description: The recorded activity.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Activity"
        "200":
          description: The activity already recorded with this `Idempotency-Key`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Activity"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/ActivityNotFound"
        "422":
          description: |
            The profile is incomplete (`profile_incomplete`), the sport needs
            a distance (`distance_required`) or takes none
            (`distance_not_allowed`), an elevation gain is sent for a sport
            or an activity that takes none (`elevation_not_allowed`), an
            exercise of `repetitions` is offered by none of the user's
            challenges (`unknown_exercise`), the activity overlaps another of
            the user (`activity_overlap`), or the week of `started_at` is
            locked in a challenge where the activity counts, or was already
            locked when the user left a challenge (`week_locked`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/activities/{activityId}:
    parameters:
      - name: activityId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      operationId: updateActivity
      summary: Replace an activity
      description: |
        Author only: the activity of someone else, a deleted one or a missing
        one answers 404 `activity_not_found`, the same answer in every case.
        The body replaces every field the author entered, with the
        validations of the creation: a field left out is cleared
        (`sport_label`, `distance_meters`, `repetitions`). The source and the
        `Idempotency-Key` of the creation stay. It is refused
        (`week_locked`) when the week of the current `started_at`, or of the
        new one, is locked in a challenge where the activity counts, or was
        already locked when the user left a challenge (as at the creation),
        and
        (`activity_overlap`) when it would overlap another activity of the
        user.
      tags: [activities]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActivityCreate"
      responses:
        "200":
          description: The activity as replaced, with the challenges where it counts now.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Activity"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/ActivityNotFound"
        "422":
          description: |
            The sport needs a distance (`distance_required`) or takes none
            (`distance_not_allowed`), an elevation gain is sent for a sport
            or an activity that takes none (`elevation_not_allowed`), an
            exercise of `repetitions` is neither on the activity nor offered
            by the user's challenges (`unknown_exercise`), it would overlap
            another activity of the user (`activity_overlap`), or the week of the current or the
            new `started_at` is locked in a challenge where the activity
            counts, or was already locked when the user left a challenge
            (`week_locked`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      operationId: deleteActivity
      summary: Delete an activity
      description: |
        Author only, as for the update (404 `activity_not_found`). The
        activity stops counting at once; it is refused (`week_locked`) when
        its week is locked in a challenge where it counts, or was already
        locked when the user left a challenge (as at the creation). Deleting
        it again
        answers 404.
      tags: [activities]
      responses:
        "204":
          description: Deleted.
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/ActivityNotFound"
        "422":
          description: The week of the activity is locked in a challenge where it counts, or was already locked when the user left a challenge (`week_locked`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/admin/stats:
    get:
      operationId: getAdminStats
      summary: Read the figures of the admin dashboard
      description: |
        Admin only (404 `not_found` otherwise). Figures of the whole app at
        `computed_at`, read on each request, never stored. "The last 7 days"
        are the 7 × 24 hours before `computed_at`. Deleted accounts count in
        none of the account figures.
      tags: [admin]
      responses:
        "200":
          description: The figures.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminStats"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/AdminNotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/admin/challenges:
    get:
      operationId: listAdminChallenges
      summary: List every challenge, for an admin
      description: |
        Admin only (404 `not_found` otherwise). Every challenge, private and
        deleted ones included, most recently created first. The status,
        filter and field alike, is computed from the current instant, deleted
        or not. `q` keeps the challenges whose title holds it, case
        insensitive (accents count); `%` and `_` are plain characters.
      tags: [admin]
      parameters:
        - name: q
          in: query
          description: Part of the title to look for.
          schema:
            type: string
            minLength: 1
            maxLength: 80
        - name: status
          in: query
          schema:
            type: string
            enum: [upcoming, ongoing, finished]
        - name: visibility
          in: query
          schema:
            type: string
            enum: [public, private]
        - name: deleted
          in: query
          description: true for the deleted challenges only, false for the others only; absent for both.
          schema:
            type: boolean
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: cursor
          in: query
          description: The `next_cursor` of the previous page, as is, with the same filters.
          schema:
            type: string
            maxLength: 200
      responses:
        "200":
          description: A page of challenges.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminChallengePage"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/AdminNotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/admin/challenges/{challengeId}:
    get:
      operationId: getAdminChallenge
      summary: Read any challenge, for an admin
      description: |
        Admin only (404 `not_found` otherwise). A challenge, private or
        deleted, with its settings, creators, weeks and how each one was
        judged, eliminations, frozen results, invitation links and last admin
        changes. An unknown challenge answers 404 `challenge_not_found`. Read
        now, never stored.
      tags: [admin]
      parameters:
        - name: challengeId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The challenge.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminChallengeDetail"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: |
            The account has no `admin` permission (`not_found`), or no such
            challenge (`challenge_not_found`). `not_found` also answers a malformed request (an id that is not a
            UUID, a body or a parameter that does not match) without the
            permission, without `params`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
    patch:
      operationId: updateAdminChallenge
      summary: Change any setting of a challenge, for an admin
      description: |
        Admin only (404 `not_found` otherwise). Changes the settings of a
        challenge, those frozen at creation included, in progress or finished
        (README §2.12): every field of the creation, checked by the same
        rules, but the first day, which may be in the past (at most a year
        ahead, as at creation). A field left out keeps its value. The
        cumulative time is always there: `categories` replaces the optional
        categories, those it leaves out being removed. A new reference sport
        starts again from the suggested factors brought back to it; otherwise
        the factors of the challenge stay. `distance_factors` then replaces
        those it names. A new first day or time zone moves the expiry of the
        invitation links not revoked to the new end of week 1.
        The challenge is then judged again as the worker would (its
        eliminations and frozen results erased, its locked weeks judged again,
        its results frozen again once its last week is locked), the change
        recorded in the journal with its `reason`, naming the challenge, all in
        one transaction. With `dry_run`, everything is
        rolled back and the answer tells what the change would do. An unknown
        or deleted challenge answers 404 `challenge_not_found`. A change that
        makes a challenge without any creator who still has an account
        upcoming or ongoing (its status read after the change) answers 422
        `no_creator`, `dry_run` included: the admin names a creator first
        (README §2.12); one that leaves it finished goes through. The body is
        optional in the contract: without one, the missing `reason` answers
        400 `validation_failed` to an admin, 404 `not_found` to anyone else.
      tags: [admin]
      parameters:
        - name: challengeId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminChallengeUpdate"
      responses:
        "200":
          description: What the change did, or would do with `dry_run`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminCorrection"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: |
            The account has no `admin` permission (`not_found`), or no such
            challenge, or a deleted one (`challenge_not_found`). `not_found` also answers a malformed request (an id that is not a
            UUID, a body or a parameter that does not match) without the
            permission, without `params`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: |
            The change would make a challenge without any creator upcoming or
            ongoing (`no_creator`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Busy"
    delete:
      operationId: deleteAdminChallenge
      summary: Delete any challenge, for an admin
      description: |
        Admin only (404 `not_found` otherwise). Deletes the challenge as one
        of its creators would, at any time (README §2.1, §2.12): from then on
        it is not found for everyone but the admins, its invitation links
        answer `invitation_invalid`, and the worker judges none of its weeks. It
        is not judged again: its eliminations and frozen results stay as they
        are, for a restore. The change is recorded in the journal with its
        `reason`, naming the challenge, in one transaction; with `dry_run`, it is rolled back. The
        answer gives the rankings `before` the deletion, `after` being null.
        An unknown or deleted challenge answers 404 `challenge_not_found`.
        The body carries the reason: a client that cannot send one with
        `DELETE` cannot call this route.
      tags: [admin]
      parameters:
        - name: challengeId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminCorrectionReason"
      responses:
        "200":
          description: What the deletion did, or would do with `dry_run`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminCorrection"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/AdminChallengeNotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Busy"
  /api/v1/admin/challenges/{challengeId}/restore:
    post:
      operationId: restoreAdminChallenge
      summary: Restore a deleted challenge, for an admin
      description: |
        Admin only (404 `not_found` otherwise). Restores a deleted challenge,
        at any time (README §2.12): it is found again as before its deletion,
        and its invitation links neither revoked nor expired are valid again.
        The accounts deleted meanwhile do not come back. The challenge is
        then judged again as the worker would (the weeks locked while it was
        deleted included), the change recorded in the journal with its
        `reason`, naming the challenge, all in one
        transaction; with `dry_run`, everything is rolled back. The answer
        gives the rankings `after` the restore, `before` being null, and the
        eliminations that change against those kept at the deletion. An
        unknown challenge, or one that is not deleted, answers 404
        `challenge_not_found`.

        A challenge always keeps a creator (README §2.12): one that the
        restore would bring back upcoming or ongoing with no creator who still
        has an account answers 422 `no_creator`, `dry_run` included, unless
        `creator_user_id` names one. A finished one is restored without (README
        §2.2). The account named becomes a creator in the transaction of the
        restore, before the challenge is judged again, whether the challenge
        has creators left or not: a participant, active or one who abandoned
        (who is not reinstated), or an account that never joined, which is
        first added as an active participant, as an admin adds one (422
        `profile_incomplete` without a complete profile). An unknown or deleted
        account answers 404 `user_not_found`. The journal line names the
        account and what it became, by its id alone.
      tags: [admin]
      parameters:
        - name: challengeId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminChallengeRestore"
      responses:
        "200":
          description: What the restore did, or would do with `dry_run`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminCorrection"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: |
            The account has no `admin` permission (`not_found`), or no such
            challenge, or one that is not deleted (`challenge_not_found`), or
            the account named is unknown or deleted (`user_not_found`).
            `not_found` also answers a malformed request (an id that is not a
            UUID, a body or a parameter that does not match) without the
            permission, without `params`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: |
            The challenge would come back upcoming or ongoing without any
            creator and none is named (`no_creator`), or the account named
            never joined and its profile is incomplete (`profile_incomplete`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Busy"
  /api/v1/admin/challenges/{challengeId}/participants:
    post:
      operationId: addAdminParticipant
      summary: Add any account to a challenge, for an admin
      description: |
        Admin only (404 `not_found` otherwise). Makes an account an active
        participant of a challenge at any time, registration closed or
        challenge finished (README §2.12): the account needs a complete
        profile (422 `profile_incomplete`), as to join. An active participant,
        a creator included, answers 409 `already_participant`; one who
        abandoned or was excluded, a creator included, answers 422
        `participation_abandoned` (reinstate them instead). An unknown or deleted account answers 404 `user_not_found`.
        The challenge is then judged again as the worker would, the change
        recorded in the journal with its `reason`, naming the challenge, all in
        one transaction; with `dry_run`, everything is
        rolled back and the answer tells what the change would do. An unknown
        or deleted challenge answers 404 `challenge_not_found`.
      tags: [admin]
      parameters:
        - name: challengeId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminParticipantAdd"
      responses:
        "200":
          description: What the change did, or would do with `dry_run`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminCorrection"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: |
            The account has no `admin` permission (`not_found`), no such
            challenge, or a deleted one (`challenge_not_found`), or no such
            account, or a deleted one (`user_not_found`). `not_found` also
            answers a malformed request (an id that is not a UUID, a body or
            a parameter that does not match) without the permission, without
            `params`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The account already takes part (`already_participant`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: |
            The account abandoned or was excluded (`participation_abandoned`),
            or its profile is incomplete (`profile_incomplete`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Busy"
  /api/v1/admin/challenges/{challengeId}/participants/{userId}:
    delete:
      operationId: excludeAdminParticipant
      summary: Exclude any participant, a creator included, for an admin
      description: |
        Admin only (404 `not_found` otherwise). Excludes a participant at any
        time, a creator included (README §2.12): eliminated from every
        category, shown as abandoned. A creator keeps the creator role, as
        one who abandons does; the admin removes it apart
        (`DELETE …/creators/{userId}`). A participant already out answers 200
        and changes nothing but the journal and the judgement. Someone who
        never joined, or a deleted account, answers 404 `not_found`. Judged
        again, journal and `dry_run` as for `POST …/participants`. The
        body carries the reason: a client that cannot send one with
        `DELETE` cannot call this route.
      tags: [admin]
      parameters:
        - name: challengeId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminCorrectionReason"
      responses:
        "200":
          description: What the change did, or would do with `dry_run`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminCorrection"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/AdminParticipantNotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Busy"
  /api/v1/admin/challenges/{challengeId}/participants/{userId}/reinstate:
    post:
      operationId: reinstateAdminParticipant
      summary: Reinstate a participant who abandoned or was excluded, for an admin
      description: |
        Admin only (404 `not_found` otherwise). Cancels an abandon or an
        exclusion, at any time (README §2.12): the participant is active
        again, ranked in every category, the weeks locked meanwhile judged
        again. An active participant answers 200 and changes nothing but the
        journal and the judgement. Someone who never joined, or a deleted
        account, answers 404 `not_found`. Judged again, journal and
        `dry_run` as for `POST …/participants`.
      tags: [admin]
      parameters:
        - name: challengeId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminCorrectionReason"
      responses:
        "200":
          description: What the change did, or would do with `dry_run`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminCorrection"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/AdminParticipantNotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Busy"
  /api/v1/admin/challenges/{challengeId}/creators/{userId}:
    put:
      operationId: addAdminCreator
      summary: Make a participant a creator, for an admin
      description: |
        Admin only (404 `not_found` otherwise). Makes a participant, active
        or not, a creator at any time, the challenge finished included
        (README §2.12). Someone who never joined, or a deleted account,
        answers 422 `not_active_participant`: every creator is a participant,
        the admin adds them first. A creator already answers 200 and changes
        nothing but the journal and the judgement. Judged again, journal
        and `dry_run` as for `POST …/participants`.
      tags: [admin]
      parameters:
        - name: challengeId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminCorrectionReason"
      responses:
        "200":
          description: What the change did, or would do with `dry_run`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminCorrection"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/AdminChallengeNotFound"
        "422":
          description: The account is not a participant (`not_active_participant`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Busy"
    delete:
      operationId: removeAdminCreator
      summary: Remove the creator role of an account, for an admin
      description: |
        Admin only (404 `not_found` otherwise). Removes the creator role, at
        any time (README §2.12); the participation stays as it is. A challenge
        always keeps a creator: removing the last one answers 422
        `last_creator` (`params.challenges`: the challenge). A participant who
        is not a creator answers 200 and changes nothing but the journal and
        the judgement. Someone who never joined, or a deleted account,
        answers 404 `not_found`. Judged again, journal and `dry_run` as
        for `POST …/participants`.
      tags: [admin]
      parameters:
        - name: challengeId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminCorrectionReason"
      responses:
        "200":
          description: What the change did, or would do with `dry_run`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminCorrection"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/AdminParticipantNotFound"
        "422":
          description: The account is the last creator of the challenge (`last_creator`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Busy"
  /api/v1/admin/users:
    get:
      operationId: listAdminUsers
      summary: List every account, for an admin
      description: |
        Admin only (404 `not_found` otherwise). Every account, deleted ones
        included, most recently registered first, with its e-mail. To look
        for an account, `POST /admin/users/search`.
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/AdminLimit"
        - $ref: "#/components/parameters/AdminCursor"
      responses:
        "200":
          description: A page of accounts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserPage"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/AdminNotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/admin/users/search:
    post:
      operationId: searchAdminUsers
      summary: Look for accounts, for an admin
      description: |
        Admin only (404 `not_found` otherwise). Reads only, writes nothing:
        a POST so that the search, which may be an e-mail, is never in the
        URL, which the platform's request logs record (README §5.7). The
        accounts of `GET /admin/users` whose pseudo, first name, last name or
        e-mail holds `q`, case insensitive (accents count); `%` and `_` are
        plain characters. A deleted account has none of them left, so `q`
        never finds one. Without `q`, or without a body, every account.
      tags: [admin]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminUserSearch"
      responses:
        "200":
          description: A page of accounts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserPage"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/AdminNotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/admin/users/{userId}:
    get:
      operationId: getAdminUser
      summary: Read any account, for an admin
      description: |
        Admin only (404 `not_found` otherwise). An account, deleted or not,
        with its e-mail. Its challenges and activities are the pages of
        `/admin/users/{userId}/challenges` and `/admin/users/{userId}/activities`.
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/AdminUserId"
      responses:
        "200":
          description: The account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/AdminUserNotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
    patch:
      operationId: updateAdminUser
      summary: Change the profile of any account, for an admin
      description: |
        Admin only (404 `not_found` otherwise). Changes the pseudo, the first
        name and the last name of an account with the rules of `PATCH /me`
        (README §2.8, §2.12): an absent field is left unchanged, `pseudo:
        null` removes the pseudo, a pseudo already taken, regardless of case,
        answers 409. The language and the e-mail stay the user's. The change
        is recorded in the journal with its `reason` (the fields that
        change, before and after), in one transaction; its journal
        line names no challenge. The answer is the account after the change.
        An unknown or deleted account answers 404 `user_not_found`.
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/AdminUserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminUserUpdate"
      responses:
        "200":
          description: The account, changed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/AdminUserNotFound"
        "409":
          description: |
            The pseudo is already taken, regardless of case
            (`validation_failed`, `params.fields` = `pseudo`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Busy"
    delete:
      operationId: deleteAdminUser
      summary: Delete any account, for an admin
      description: |
        Admin only (404 `not_found` otherwise). Deletes the account with the
        effect of `DELETE /me` (README §2.12, §6): refused (422
        `last_creator`) while it is the last creator of a challenge not
        finished, it is anonymized and every row tied to it is erased; its
        deletion at Auth0 follows, replayed by the worker
        (`retry-auth0-deletions`) when it fails. The profile values (pseudo,
        first name, last name, e-mail) of the journal lines that target the
        account are erased too. Nothing is judged again, as for `DELETE /me`.
        The change is recorded in the journal with its `reason`, in the
        transaction of the deletion. Refused (422 `last_creator`) while the
        account is the last creator with an account of a challenge not
        finished: the admin first names another creator, or deletes the
        challenge; `params.challenges` lists their ids. An unknown or deleted
        account answers 404 `user_not_found`. The body carries the reason: a
        client that cannot send one with `DELETE` cannot call this route.
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/AdminUserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminAccountReason"
      responses:
        "204":
          description: Deleted.
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/AdminUserNotFound"
        "422":
          description: |
            The account is the last creator of challenges not finished
            (`last_creator`); `params.challenges` lists them.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Busy"
  /api/v1/admin/users/{userId}/block:
    post:
      operationId: blockAdminUser
      summary: Block any account, for an admin
      description: |
        Admin only (404 `not_found` otherwise). Blocks the account (README
        §2.12): from then on, every request of it answers 403
        `account_blocked`, except the deletion of its own account
        (`DELETE /api/v1/me`). Its challenges are left as they are: it stays
        ranked and its activities count. An account already blocked stays
        blocked since the first time; the call still answers and is
        recorded. The change is recorded in the journal with its `reason`,
        in one transaction; its journal line names no challenge. An admin
        cannot block their own account (403 `forbidden`). The answer is the
        account after the change. An unknown or deleted account answers 404
        `user_not_found`.
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/AdminUserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminAccountReason"
      responses:
        "200":
          description: The account, blocked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: The admin tried to block their own account (`forbidden`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/AdminUserNotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Busy"
  /api/v1/admin/users/{userId}/unblock:
    post:
      operationId: unblockAdminUser
      summary: Unblock any account, for an admin
      description: |
        Admin only (404 `not_found` otherwise). Unblocks the account (README
        §2.12): its requests are served again; nothing else changes. An
        account that is not blocked stays so; the call still answers and is
        recorded. The change is recorded in the journal with its `reason`,
        in one transaction; its journal line names no challenge. The answer is
        the account after the change. An unknown or deleted account answers
        404 `user_not_found`.
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/AdminUserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminAccountReason"
      responses:
        "200":
          description: The account, unblocked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/AdminUserNotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Busy"
  /api/v1/admin/users/{userId}/challenges:
    get:
      operationId: listAdminUserChallenges
      summary: List the challenges of any account, for an admin
      description: |
        Admin only (404 `not_found` otherwise). The challenges the account
        joined or creates, deleted ones included, most recently created
        first: the `challenge_count` of the account. A deleted account has
        none left.
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/AdminUserId"
        - $ref: "#/components/parameters/AdminLimit"
        - $ref: "#/components/parameters/AdminCursor"
      responses:
        "200":
          description: A page of challenges.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserChallengePage"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/AdminUserNotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/admin/users/{userId}/activities:
    get:
      operationId: listAdminUserActivities
      summary: List the activities of any account, for an admin
      description: |
        Admin only (404 `not_found` otherwise). The activities of the
        account, deleted ones excluded, the most recent session first
        (`started_at`). A deleted account has none left.
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/AdminUserId"
        - $ref: "#/components/parameters/AdminLimit"
        - $ref: "#/components/parameters/AdminCursor"
      responses:
        "200":
          description: A page of activities.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminActivityPage"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/AdminUserNotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: createAdminActivity
      summary: Record an activity for any account, for an admin
      description: |
        Admin only (404 `not_found` otherwise). Records an activity for the
        account, in any week, locked ones and those of a finished challenge
        included (README §2.12), with the validations of `POST /activities`:
        the account needs a complete profile (`profile_incomplete`), the
        activity never overlaps another of the account (`activity_overlap`),
        and its end is never in the future. Its source is `manual`, as an
        entry by the account; the journal tells them apart. An unknown or
        deleted account answers 404 `user_not_found`. Every challenge where
        the activity counts (the account an active participant, its window
        holding `started_at`, or a challenge the account left once that week
        was locked, whose points category and elimination still judge them) is then judged again as
        the worker would, the change recorded in the journal with its
        `reason`, naming those challenges, all in one
        transaction; with `dry_run`, everything is rolled back and the answer
        tells what the change would do. The answer lists those challenges,
        none for an activity that counts nowhere. With `Idempotency-Key`,
        unique per account of the activity as for `POST /activities` (a key
        the account used for its own entry included), a valid request sent again
        with the same key, even with another body, records nothing, writes
        no journal line and judges nothing again: it answers 200 with no
        challenge, or 404 `activity_not_found` once that activity is
        deleted. A `dry_run` records nothing and leaves the key free.
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/AdminUserId"
        - name: Idempotency-Key
          in: header
          required: false
          description: Key chosen by the client (a UUID, for instance), unique per account of the activity.
          schema:
            type: string
            pattern: "^[!-~]{1,128}$"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminActivityWrite"
      responses:
        "200":
          description: What the change did, or would do with `dry_run`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminCorrection"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: |
            The account has no `admin` permission (`not_found`), no such
            account, or a deleted one (`user_not_found`), or the
            `Idempotency-Key` gave a deleted activity (`activity_not_found`).
            `not_found` also answers a malformed request without the
            permission, without `params`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: |
            The profile of the account is incomplete (`profile_incomplete`),
            the sport needs a distance (`distance_required`) or takes none
            (`distance_not_allowed`), an elevation gain is sent for a sport
            or an activity that takes none (`elevation_not_allowed`), an exercise
            no challenge of the account offers (`unknown_exercise`), or the
            activity would overlap another of the account (`activity_overlap`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Busy"
  /api/v1/admin/activities/{activityId}:
    parameters:
      - name: activityId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      operationId: updateAdminActivity
      summary: Replace the activity of any account, for an admin
      description: |
        Admin only (404 `not_found` otherwise). Replaces the activity, in any
        week, locked ones and those of a finished challenge included (README
        §2.12), with the validations of `PATCH /activities/{activityId}`: the
        body replaces every field entered, a field left out is cleared. The
        source stays. A missing or deleted activity, or that of a deleted
        account, answers 404 `activity_not_found`. Every challenge where it
        counts before the change, and after it (a new `started_at` may move
        it from a challenge to another), is judged again; journal and
        `dry_run` as for `POST /admin/users/{userId}/activities`.
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminActivityWrite"
      responses:
        "200":
          description: What the change did, or would do with `dry_run`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminCorrection"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/AdminActivityNotFound"
        "422":
          description: |
            The sport needs a distance (`distance_required`) or takes none
            (`distance_not_allowed`), an elevation gain is sent for a sport
            or an activity that takes none (`elevation_not_allowed`), an exercise
            no challenge of the account offers (`unknown_exercise`), or the
            activity would overlap another of the account (`activity_overlap`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Busy"
    delete:
      operationId: deleteAdminActivity
      summary: Delete the activity of any account, for an admin
      description: |
        Admin only (404 `not_found` otherwise). Deletes the activity, in any
        week, locked ones and those of a finished challenge included (README
        §2.12): it stops counting at once. A missing or deleted activity, or
        that of a deleted account, answers 404 `activity_not_found`. Every
        challenge where it counted is judged again; journal and
        `dry_run` as for `POST /admin/users/{userId}/activities`. The body
        carries the reason: a client that cannot send one with `DELETE`
        cannot call this route.
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminCorrectionReason"
      responses:
        "200":
          description: What the change did, or would do with `dry_run`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminCorrection"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/AdminActivityNotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Busy"
  /api/v1/admin/actions:
    get:
      operationId: listAdminActions
      summary: Read the journal of the admin changes
      description: |
        Admin only (404 `not_found` otherwise). Every admin change, with its
        reason, most recent first. `target_type` and `target_id` keep the
        changes of one target (both, or either); `admin_id` those of one
        admin; `challenge_id` those that touch a challenge, whatever their
        target (an activity counts in several challenges). The filters add
        up.
      tags: [admin]
      parameters:
        - name: target_type
          in: query
          schema:
            $ref: "#/components/schemas/AdminActionTargetType"
        - name: target_id
          in: query
          schema:
            type: string
            format: uuid
        - name: admin_id
          in: query
          schema:
            type: string
            format: uuid
        - name: challenge_id
          in: query
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/AdminLimit"
        - $ref: "#/components/parameters/AdminCursor"
      responses:
        "200":
          description: A page of the journal.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminActionPage"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/AdminNotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Auth0 access token of a user (audience of the API); machine-to-machine tokens are refused.
  parameters:
    AdminUserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AdminLimit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    AdminCursor:
      name: cursor
      in: query
      description: The `next_cursor` of the previous page, as is, with the same filters.
      schema:
        type: string
        maxLength: 200
    TimeZone:
      name: tz
      in: query
      required: true
      description: |
        IANA time zone the weeks and days are cut in (that of the activity
        entry: the one the challenges in progress share, else the device's).
        An unknown zone gives `validation_failed` on `tz`.
      schema:
        type: string
        minLength: 1
        maxLength: 64
        example: America/Toronto
    SportFilter:
      name: sport
      in: query
      description: |
        Keeps the activities of this sport of the catalogue (`other` keeps
        every activity of the sport `other`). An unknown sport keeps none.
      schema:
        type: string
        pattern: "^[a-z][a-z0-9_]{0,31}$"
        example: run
  responses:
    Unauthorized:
      description: |
        Missing or malformed credentials (`unauthenticated`), invalid access
        token (`invalid_token`), expired access token (`token_expired`) or
        deleted account (`account_deleted`).
      headers:
        WWW-Authenticate:
          description: '`Bearer`, or `Bearer error="invalid_token"` for an invalid or expired token (RFC 6750).'
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: The resource is visible but the action is not allowed to the user (`forbidden`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ChallengeNotFound:
      description: |
        No such challenge, a deleted one, or a private one the user may not
        see (`challenge_not_found`): the same answer in every case.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InvitationInvalid:
      description: |
        No valid invitation for the token (`invitation_invalid`): unknown,
        malformed, expired, revoked, of an author who may no longer invite,
        or to a deleted challenge. The same answer in every case.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ActivityNotFound:
      description: |
        No such activity, a deleted one, or one of another user
        (`activity_not_found`): the same answer in every case. Also the
        answer of a creation whose `Idempotency-Key` gave a deleted activity.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    AdminNotFound:
      description: |
        The account has no `admin` permission in its access token
        (`not_found`): an `/admin` route answers as if it did not exist,
        whatever the request, malformed included (a body that does not match,
        a parameter out of its bounds, a path id that is not a UUID), and
        without `params`. Only an admin gets the 400 `validation_failed` of a
        malformed request, with its fields.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    AdminUserNotFound:
      description: |
        The account has no `admin` permission (`not_found`), or no such
        account, or a deleted one (`user_not_found`). `not_found` also
        answers a malformed request (an id that is not a UUID, a body or a
        parameter that does not match) without the permission, without
        `params`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    AdminChallengeNotFound:
      description: |
        The account has no `admin` permission (`not_found`), or no such
        challenge, or a deleted one (`challenge_not_found`). `not_found` also
        answers a malformed request (an id that is not a UUID, a body or a
        parameter that does not match) without the permission, without
        `params`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    AdminActivityNotFound:
      description: |
        The account has no `admin` permission (`not_found`), or no such
        activity, a deleted one, or that of a deleted account
        (`activity_not_found`). `not_found` also answers a malformed request
        (an id that is not a UUID, a body or a parameter that does not
        match) without the permission, without `params`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    AdminParticipantNotFound:
      description: |
        The account has no `admin` permission, or the account never joined
        the challenge, or was deleted (`not_found`), or no such challenge, or
        a deleted one (`challenge_not_found`). `not_found` also answers a
        malformed request (an id that is not a UUID, a body or a parameter
        that does not match) without the permission, without `params`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Busy:
      description: |
        The change waited more than 10 s for one of its locks, held by the
        activity writes and the runs of the worker in progress, or the
        deadline of the request (25 s) fell before it ended, or it was
        stopped by a deadlock with another change (`busy`): nothing was
        written. Try again in a moment.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InternalError:
      description: |
        Technical failure (`internal_error`), logged with its `request_id`;
        the cause is never sent back.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    RateLimited:
      description: |
        Too many requests (`rate_limited`): from the same IP address on any
        route, or by the same user on a write route. Retry after the delay.
      headers:
        Retry-After:
          description: Seconds to wait before the next request.
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ValidationFailed:
      description: |
        The request does not match the contract (`validation_failed`).
        `params.fields` lists the invalid fields, comma-separated
        (`pseudo,language`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Error:
      description: Single error format of the API. Clients translate `code`; `message` is only an English fallback.
      type: object
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: object
          required: [code, message]
          additionalProperties: false
          properties:
            code:
              $ref: "#/components/schemas/ErrorCode"
            message:
              type: string
              description: English fallback text, never shown as is by the apps.
            params:
              type: object
              description: Values for the client's text (a deadline...); never personal data.
              additionalProperties:
                type: string
            request_id:
              type: string
              description: Identifier of the request, also in the server logs.
    ErrorCode:
      description: Stable error codes. Each ticket adds the codes it returns.
      type: string
      enum:
        - unauthenticated
        - invalid_token
        - token_expired
        - account_deleted
        - account_blocked
        - profile_incomplete
        - challenge_not_found
        - activity_not_found
        - user_not_found
        - invitation_invalid
        - forbidden
        - field_not_editable
        - registration_closed
        - already_participant
        - participation_abandoned
        - challenge_ended
        - cannot_exclude_creator
        - not_active_participant
        - last_creator
        - no_creator
        - distance_required
        - distance_not_allowed
        - elevation_not_allowed
        - unknown_exercise
        - week_locked
        - activity_overlap
        - cursor_invalid
        - rate_limited
        - not_found
        - validation_failed
        - busy
        - internal_error
    AdminStats:
      type: object
      required: [computed_at, accounts, challenges, activities_last_7_days, pending_auth0_deletions, blocked_auth0_deletions, worker_tasks, build]
      additionalProperties: false
      properties:
        computed_at:
          type: string
          format: date-time
          description: The instant the figures were read at (UTC).
        accounts:
          $ref: "#/components/schemas/AdminAccountCounts"
        challenges:
          $ref: "#/components/schemas/AdminChallengeCounts"
        activities_last_7_days:
          type: integer
          minimum: 0
          description: Activities recorded in the last 7 days, whatever their date; deleted ones and those of deleted accounts excluded.
        pending_auth0_deletions:
          type: integer
          minimum: 0
          description: |
            Deleted accounts whose deletion at Auth0 failed and is still to be
            replayed by the worker (`retry-auth0-deletions`).
        blocked_auth0_deletions:
          type: integer
          minimum: 0
          description: |
            Among `pending_auth0_deletions`, those Auth0 refused for good at
            their last replay (a 4xx proper to the account, such as a malformed
            identifier; neither 401 nor 403, which refuse every deletion and
            still fail the task, nor 404, 408 and 429). Still replayed, they
            no longer fail the task; they wait for someone to fix the cause.
        worker_tasks:
          type: array
          description: Every task of the worker, in the order of the enum of `task`, run or not.
          items:
            $ref: "#/components/schemas/AdminWorkerTask"
        build:
          $ref: "#/components/schemas/AdminBuild"
    AdminAccountCounts:
      type: object
      required: [total, new_last_7_days, active_last_7_days, blocked]
      additionalProperties: false
      properties:
        total:
          type: integer
          minimum: 0
          description: Accounts not deleted, profile complete or not.
        new_last_7_days:
          type: integer
          minimum: 0
          description: Accounts not deleted, created in the last 7 days.
        active_last_7_days:
          type: integer
          minimum: 0
          description: Accounts not deleted that recorded at least one activity in the last 7 days.
        blocked:
          type: integer
          minimum: 0
          description: Accounts not deleted that an admin blocked, counted in `total` too.
    AdminChallengeCounts:
      type: object
      required: [upcoming, ongoing, finished, deleted]
      additionalProperties: false
      description: |
        Every challenge, private ones included. The statuses are those at
        `computed_at` and count the challenges not deleted; `deleted` counts
        the deleted ones, whatever their status.
      properties:
        upcoming:
          type: integer
          minimum: 0
        ongoing:
          type: integer
          minimum: 0
        finished:
          type: integer
          minimum: 0
        deleted:
          type: integer
          minimum: 0
    AdminWorkerTask:
      type: object
      required: [task]
      additionalProperties: false
      properties:
        task:
          type: string
          enum: [close-weeks, finalize-challenges, retry-auth0-deletions]
        last_run:
          $ref: "#/components/schemas/AdminWorkerRun"
        last_failure:
          $ref: "#/components/schemas/AdminWorkerRun"
    AdminWorkerRun:
      type: object
      required: [started_at]
      additionalProperties: false
      description: |
        A run of a worker task. `last_run` is absent when the task never
        ran, `last_failure` when it never failed (of the runs kept: the 500
        most recent, and the last failure however old).
      properties:
        started_at:
          type: string
          format: date-time
        ended_at:
          type: string
          format: date-time
          description: Absent while the run goes on, or when it was stopped before it could end (time limit of the job).
        outcome:
          type: string
          enum: [succeeded, failed]
          description: Absent when `ended_at` is.
        error_code:
          type: string
          description: Stable code of the failure, for a failed run only; never a message.
          example: internal_error
    AdminBuild:
      type: object
      required: [version, commit]
      additionalProperties: false
      description: The build of the API that answers, as `GET /health` gives it.
      properties:
        version:
          type: string
          example: v1.2.3
        commit:
          type: string
          example: 0123456789abcdef0123456789abcdef01234567
    AdminUserRef:
      type: object
      required: [id, pseudo, first_name, last_name]
      additionalProperties: false
      description: An account, as a creator sees it in the participants. A deleted account is never named.
      properties:
        id:
          type: string
          format: uuid
        pseudo:
          type: string
          nullable: true
          description: Null until the user chooses one.
        first_name:
          type: string
          nullable: true
          description: Null for an account that has not set it.
        last_name:
          type: string
          nullable: true
          description: Null for an account that has not set it.
