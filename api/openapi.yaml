openapi: 3.0.3
info:
  title: Sport Challenge API
  version: 0.1.0
  description: |
    Backend of the Sport Challenge app. This file is the source of truth:
    change it first, then run `make generate`.

    Health endpoints live at the root; business routes live under `/api/v1`.

    Every route requires an Auth0 access token (`bearerAuth`), declared once
    below: a new route is protected without adding anything. Only the health
    probes opt out with `security: []`.
  license:
    name: Proprietary
    url: https://github.com/damchi/sport-challenge-api
servers:
  - url: /
security:
  - bearerAuth: []
tags:
  - name: health
    description: Liveness and readiness probes.
paths:
  /healthz:
    get:
      operationId: getHealthz
      summary: Liveness probe
      description: Always returns 200 while the process is able to serve requests.
      tags: [health]
      security: []
      responses:
        "200":
          description: The process is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /readyz:
    get:
      operationId: getReadyz
      summary: Readiness probe
      description: Returns 200 when the database answers, 503 otherwise.
      tags: [health]
      security: []
      responses:
        "200":
          description: The API can serve traffic.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
              example:
                status: ok
        "503":
          description: A dependency (the database) does not answer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
              example:
                status: unavailable
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Auth0 access token of a user (audience of the API); machine-to-machine tokens are refused.
  responses:
    Unauthorized:
      description: |
        Missing or malformed credentials (`unauthenticated`), invalid access
        token (`invalid_token`), expired access token (`token_expired`) or
        deleted account (`account_deleted`).
      headers:
        WWW-Authenticate:
          description: '`Bearer`, or `Bearer error="invalid_token"` for an invalid or expired token (RFC 6750).'
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Error:
      description: Single error format of the API. Clients translate `code`; `message` is only an English fallback.
      type: object
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: object
          required: [code, message]
          additionalProperties: false
          properties:
            code:
              $ref: "#/components/schemas/ErrorCode"
            message:
              type: string
              description: English fallback text, never shown as is by the apps.
            params:
              type: object
              description: Values for the client's text (a deadline...); never personal data.
              additionalProperties:
                type: string
            request_id:
              type: string
              description: Identifier of the request, also in the server logs.
    ErrorCode:
      description: Stable error codes. Each ticket adds the codes it returns.
      type: string
      enum:
        - unauthenticated
        - invalid_token
        - token_expired
        - account_deleted
        - not_found
        - validation_failed
        - internal_error
    Health:
      type: object
      required: [status]
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [ok]
    Readiness:
      type: object
      required: [status]
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [ok, unavailable]
