            without them).
          pattern: "^[a-z][a-z0-9_]{0,31}$"
          example: run
        distance_factors:
          type: object
          description: |
            Factors that replace those of the challenge, by sport code, with
            the rules of the creation: distance sports only, 0.1 to 2, two
            decimals at most, the reference sport refused; only with the
            cumulative distance or the `longest_distance` criterion.
          additionalProperties:
            type: number
            format: double
            minimum: 0.1
            maximum: 2
          example:
