        start_date:
          type: string
          format: date
          description: First local day, in the past or at most a year ahead in `timezone`.
          example: "2026-12-07"
        weeks:
          type: integer
          minimum: 2
          maximum: 52
          description: Duration in whole weeks.
        categories:
          description: |
