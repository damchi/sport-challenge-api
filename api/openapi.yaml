          type: integer
          nullable: true
          description: Positive elevation gain in meters; null when not entered.
        source:
          type: string
          enum: [manual]
        speed_mps:
          type: number
          format: double
          nullable: true
          description: Speed in meters per second, computed as `Activity.speed_mps`; null without distance.
        pace_seconds_per_km:
          type: number
          format: double
          nullable: true
          description: Pace in seconds per kilometer, computed as `Activity.pace_seconds_per_km`; null without distance.
        created_at:
          type: string
          format: date-time
          description: When the activity was recorded.
        contributions:
          type: array
          description: |
            What the activity brings, now, to each challenge where it counts,
            as `Activity.contributions`; possibly empty. A deleted challenge
            never appears.
          items:
            $ref: "#/components/schemas/ActivityContribution"
        repetitions:
          type: array
          description: As `Activity.repetitions`, every one, sorted by exercise; absent when none.
          items:
            $ref: "#/components/schemas/ActivityRepetitions"
        locked:
          type: boolean
          description: |
            As `Activity.locked`: true once the week of the activity is locked
            in a challenge where it counts, or was already locked when the
            author left a challenge (abandoned or excluded). An admin can
            still change it.
        admin_change:
          type: object
          nullable: true
          allOf:
            - $ref: "#/components/schemas/AdminActivityChange"
          description: |
            The last time an admin added or changed the activity, from the
            journal (`activity.create`, `activity.update`): its source stays
            `manual`. Null when no admin added nor changed it.
    AdminActivityChange:
      type: object
      description: The last line of the journal where an admin added or changed an activity.
      required: [action, at, admin_id]
      additionalProperties: false
      properties:
        action:
          type: string
          enum: [created, updated]
          x-enum-varnames: [AdminActivityChangeActionCreated, AdminActivityChangeActionUpdated]
          description: "`created`: an admin added the activity; `updated`: an admin changed it."
        at:
          type: string
          format: date-time
          description: When the admin did it (the time of the journal line).
        admin_id:
          type: string
          format: uuid
          description: The account of the admin, its id only.
    AdminActionPage:
      type: object
      required: [items, next_cursor]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AdminAction"
        next_cursor:
          type: string
          nullable: true
          description: Pass it as `cursor` for the next page; null on the last page.
    AdminAction:
      type: object
      required: [id, admin, created_at, action, target_type, target_id, challenge_ids, old_value, new_value, reason]
      additionalProperties: false
      description: An admin change, as the journal keeps it.
      properties:
        id:
          type: string
          format: uuid
        admin:
          $ref: "#/components/schemas/AdminUserRef"
        created_at:
          type: string
          format: date-time
        action:
          type: string
          description: Stable code of the change (`challenge.update`, `participant.add`...), translated by the client.
        target_type:
          $ref: "#/components/schemas/AdminActionTargetType"
        target_id:
          type: string
          format: uuid
          description: The id of the target; for a participant, that of its account (its challenge is in `challenge_ids`).
        challenge_ids:
          type: array
          description: Every challenge the change touches; empty when it touches none.
          items:
            type: string
            format: uuid
        old_value:
          type: object
          nullable: true
          additionalProperties: true
          description: What the change replaced, the fields it changed only; null when it created the target.
        new_value:
          type: object
          nullable: true
          additionalProperties: true
          description: What the change wrote, the fields it changed only; null when it removed the target.
        reason:
          type: string
          minLength: 3
          maxLength: 500
          description: The reason the admin gave.
    AdminActionTargetType:
      type: string
      enum: [challenge, participant, activity, user]
    Health:
      type: object
      required: [status, version, commit]
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [ok]
        version:
          type: string
          description: |
            The semantic version of the running build (`v1.2.3`), or `dev` for
            a build that was not released.
          example: v1.2.3
        commit:
          type: string
          description: The full SHA of the Git commit the running build was made from, or `unknown`.
          example: 0123456789abcdef0123456789abcdef01234567
    Readiness:
      type: object
      required: [status]
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [ok, unavailable]
    Pseudo:
      description: 3 to 20 ASCII letters, digits, `_`, `.` or `-`; unique regardless of case.
      type: string
      pattern: "^[A-Za-z0-9_.-]{3,20}$"
      example: marie_92
    PersonName:
      description: |
        A first or last name: 1 to 50 letters (any alphabet, accents
        included), words separated by one space, `-`, `'` or `’`, each
        starting with a letter; no space at either end.
      type: string
      maxLength: 50
      pattern: "^\\p{L}[\\p{L}\\p{M}]*(?:[ '’-]\\p{L}[\\p{L}\\p{M}]*)*$"
      example: Marie-Ève
    Language:
      type: string
      enum: [fr, en]
    Me:
      type: object
      required: [id, pseudo, first_name, last_name, email, avatar, language, profile_complete, is_admin]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        pseudo:
          type: string
          nullable: true
          allOf:
            - $ref: "#/components/schemas/Pseudo"
          description: Null until the user chooses one, or once removed (optional).
        first_name:
          type: string
          nullable: true
          allOf:
            - $ref: "#/components/schemas/PersonName"
          description: Null until the user sets it.
        last_name:
          type: string
          nullable: true
          allOf:
            - $ref: "#/components/schemas/PersonName"
          description: Null until the user sets it.
        email:
          type: string
          nullable: true
          maxLength: 254
          description: |
            From the access token (claim set by the auth provider); null until
            a token carries it. Only returned to its owner, and to the admins
            (`/admin/users`).
        avatar:
          type: string
          nullable: true
          description: |
            Avatar image; always null in V1, where the apps show the initials
            of the pseudo, or of the first and last names without one.
        language:
          type: string
          nullable: true
          allOf:
            - $ref: "#/components/schemas/Language"
          description: Null until the user chooses one.
        profile_complete:
          type: boolean
          description: True once the first name and the last name are set, with or without a pseudo.
        is_admin:
          type: boolean
          description: |
            True when the access token of the request carries the `admin`
            permission (Auth0 role, README §2.12); never stored. Only lets the
            apps show the administration: every admin route checks the
            permission again.
    MeUpdate:
      type: object
      additionalProperties: false
      properties:
        pseudo:
          type: string
          nullable: true
          allOf:
            - $ref: "#/components/schemas/Pseudo"
          description: "`null` removes the pseudo."
          # Tells an absent pseudo (left as is) from null (removed).
          x-go-type: nullable.Nullable[string]
          x-go-type-skip-optional-pointer: true
          x-go-type-import:
            path: github.com/oapi-codegen/nullable
        first_name:
          $ref: "#/components/schemas/PersonName"
        last_name:
          $ref: "#/components/schemas/PersonName"
        language:
          $ref: "#/components/schemas/Language"
    SportList:
      type: object
      required: [sports]
      additionalProperties: false
      properties:
        sports:
          type: array
          items:
            $ref: "#/components/schemas/Sport"
    Sport:
      type: object
      required: [code, distance_mode, suggested_factor, elevation_allowed, exercises]
      additionalProperties: false
      properties:
        code:
          type: string
          description: Stable code, translated by the apps (`run`, `ride`, `other`...).
          example: ride
        distance_mode:
          type: string
          enum: [required, none, optional]
          description: Whether an activity of this sport has a distance; `optional` for `other`.
        suggested_factor:
          type: number
          format: double
          nullable: true
          minimum: 0.1
          maximum: 2
          description: Suggested distance factor (0.1 to 2, two decimals); null for sports without distance.
          example: 0.3
        elevation_allowed:
          type: boolean
          description: |
            Whether an activity of this sport may have an elevation gain
            (`elevation_gain_meters`), with a distance; always false for a
            sport without distance.
        exercises:
          type: array
          description: |
            Codes of the exercises of the sport (elimination by repetitions,
            README §2.3 and §2.5), in display order, translated by the apps;
            empty for a sport without exercises.
          items:
            type: string
            example: wall_ball
    ChallengeCreate:
      type: object
      required: [title, visibility, timezone, start_date, weeks]
      additionalProperties: false
      properties:
        title:
          type: string
          description: |
            3 to 80 characters once surrounding spaces are removed, 3 of them
            visible (the kept formatting characters below do not count); checked
            by the service, not by the schema, which would count those spaces. No
            control character, no line or
            paragraph separator (U+2028, U+2029), no invisible or bidirectional
            formatting character (Unicode Cf, such as U+200B or U+202E) but
            U+200C, U+200D, U+200E, U+200F and the tags of flags (U+E0020 to
            U+E007F).
          example: Spring run
        description:
          type: string
          maxLength: 2000
          description: |
            2000 characters at most; an empty string means no description. No
            control character but line breaks and tabs (line and paragraph
            separators U+2028 and U+2029 allowed too), no invisible or bidirectional
            formatting character (Unicode Cf, such as U+200B or U+202E) but
            U+200C, U+200D, U+200E, U+200F and the tags of flags (U+E0020 to
            U+E007F).
        visibility:
          type: string
          enum: [public, private]
        members_can_invite:
          type: boolean
          description: |
            Whether participants may invite people, not only creators. `false`
            when absent; `null` is refused (no default in the schema, which
            would replace it).
        timezone:
          type: string
          description: IANA time zone of the place the challenge is run from; the weeks are cut in it.
          example: America/Toronto
        start_date:
          type: string
          format: date
          description: First local day, between today and the same day next year in `timezone`.
          example: "2026-12-07"
        weeks:
          type: integer
          minimum: 2
          maximum: 52
          description: Duration in whole weeks.
        categories:
          $ref: "#/components/schemas/CategoriesCreate"
        reference_sport:
          type: string
          description: |
            Code of the sport the distances are brought back to and the
            elimination is run in: a sport of the catalogue whose distance is
            required or none (`distance_mode` `required` or `none`), otherwise
            400 `validation_failed` on `reference_sport`. Without distance, 400
            `validation_failed` names each choice that needs one:
            `categories.cumulative_distance`, `categories.cumulative_elevation`,
            `categories.elimination`, `categories.points.criteria` (with
            `longest_distance`, `weekly_elevation` or `fastest_run`) and
            `distance_factors`. `run` when absent; `null` is refused (no
            default in the schema, which would replace it).
          pattern: "^[a-z][a-z0-9_]{0,31}$"
          example: run
        distance_factors:
          type: object
          description: |
            Factors chosen by the creator, by sport code (distance sports only,
            0.1 to 2, two decimals at most), for the cumulative distance and
            the `longest_distance` criterion of the points category: without
            either, or with a reference sport without distance, sending them
            answers 400 `validation_failed` on `distance_factors`. Send only
            the factors the creator changed: sports not given keep their suggested factor brought back
            to the reference sport, min(1, factor / factor of the reference),
            rounded to two decimals and never under 0.1. The reference sport is
            refused, even at 1: it always counts x1.
          additionalProperties:
            type: number
            format: double
            minimum: 0.1
            maximum: 2
          example:
            ride: 0.25
    CategoriesCreate:
      type: object
      additionalProperties: false
      description: |
        The optional categories the creator chooses, each present to be
        part of the challenge; the cumulative time is always there. Absent,
        the challenge has the cumulative time only. Frozen at creation.
      properties:
        cumulative_distance:
          $ref: "#/components/schemas/CumulativeDistanceCreate"
        elimination:
          $ref: "#/components/schemas/EliminationCreate"
        points:
          $ref: "#/components/schemas/PointsCreate"
        cumulative_elevation:
          $ref: "#/components/schemas/CumulativeElevationCreate"
    CumulativeDistanceCreate:
      type: object
      additionalProperties: false
      description: Cumulative distance, with the factors of `distance_factors`; no settings of its own.
    CumulativeElevationCreate:
      type: object
      additionalProperties: false
      description: |
        Cumulative elevation gain: the elevation gains of the activities of
        every sport that takes one, in real meters, without factor (an
        activity without is 0 m); no settings.
    EliminationCreate:
      type: object
      additionalProperties: false
      description: |
        Elimination, run in the reference sport: `step_meters` with a
        reference sport that has a distance; `exercise` and
        `step_repetitions` with a reference sport without distance (the
        weekly sum of the repetitions of that exercise). The other form is
        refused (400 `validation_failed` on its field), and so is the
        elimination under a reference sport without exercises.
      properties:
        step_meters:
          type: integer
          minimum: 1
          maximum: 100000
          description: Increment X, in meters; reference sport with a distance only.
        exercise:
          type: string
          minLength: 1
          description: |
            Code of an exercise of the reference sport (`Sport.exercises`);
            reference sport without distance only.
          example: wall_ball
        step_repetitions:
          type: integer
          minimum: 1
          maximum: 1000
          description: Increment X, in repetitions; reference sport without distance only.
    PointsCreate:
      type: object
      required: [criteria, podium]
      additionalProperties: false
      description: |
        Points: each week, each criterion ranks the participants, and the top
        of each of these weekly rankings scores the points of the scale.
      properties:
        criteria:
          type: array
          minItems: 1
          maxItems: 5
          uniqueItems: true
          description: |
            The longest session by duration (every sport), the longest
            session by equivalent distance (with the factors of
            `distance_factors`), the number of sessions of at least
            `min_session_minutes`, the elevation gain of the week (every
            sport that takes one, in real meters, without factor), the
            fastest run (the lowest pace of a single `run` session with a
            distance, in seconds per km, real distance without factor, the
            lowest winning; it needs no `distance_factors`). At least one,
            each once.
          items:
            type: string
            enum: [longest_duration, longest_distance, session_count, weekly_elevation, fastest_run]
        podium:
          type: integer
          enum: [5, 10]
          description: Top 5 (10, 8, 6, 4, 2) or top 10 (25, 18, 15, 12, 10, 8, 6, 4, 2, 1).
        min_session_minutes:
          type: integer
          minimum: 1
          maximum: 180
          default: 20
          description: Minimum duration of a session counted by `session_count`, in minutes.
    Challenge:
      type: object
      required: [id, title, description, visibility, members_can_invite, timezone, reference_sport, starts_at, ends_at, categories]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
          nullable: true
        visibility:
          type: string
          enum: [public, private]
        members_can_invite:
          type: boolean
        timezone:
          type: string
        reference_sport:
          type: string
          description: Code of the sport the distances are brought back to and the elimination is run in.
        starts_at:
          type: string
          format: date-time
          description: Local midnight of the first day, in UTC.
        ends_at:
          type: string
          format: date-time
          description: End of the window (excluded), in UTC.
        categories:
          type: array
          description: The categories of the challenge, in their order.
          items:
            $ref: "#/components/schemas/Category"
    Category:
      type: object
      required: [type, position, params]
      additionalProperties: false
      properties:
        type:
          type: string
          enum: [cumulative_time, cumulative_distance, elimination, points, cumulative_elevation]
        position:
          type: integer
          minimum: 1
          maximum: 5
          description: Fixed by type, gaps left by the missing categories (cumulative_time 1, cumulative_distance 2, elimination 3, points 4, cumulative_elevation 5).
        params:
          $ref: "#/components/schemas/CategoryParams"
    CategoryParams:
      type: object
      additionalProperties: false
      description: Frozen settings of the category.
      properties:
        factors:
          type: object
          description: |
            cumulative_distance, and points with the `longest_distance`
            criterion: distance factor by sport code.
          additionalProperties:
            type: number
            format: double
        sport:
          type: string
          description: Elimination category only, the reference sport of the challenge.
        step_meters:
          type: integer
          description: Elimination category only, increment X in meters.
        exercise:
          type: string
          description: Elimination category under a reference sport without distance only, the exercise whose repetitions count.
        step_repetitions:
          type: integer
          description: Elimination category under a reference sport without distance only, increment X in repetitions.
        criteria:
          type: array
          description: Points category only, its criteria in the order chosen.
          items:
            type: string
            enum: [longest_duration, longest_distance, session_count, weekly_elevation, fastest_run]
        podium:
          type: integer
          enum: [5, 10]
          description: Points category only, the size of the top that scores.
        min_session_seconds:
          type: integer
          minimum: 60
          maximum: 10800
          description: Points category only, minimum duration of a session counted by `session_count`, in seconds.
    ChallengePage:
      type: object
      required: [items, next_cursor, counts]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ChallengeSummary"
        next_cursor:
          type: string
          nullable: true
          description: Pass it as `cursor` for the next page; null on the last page.
        counts:
          $ref: "#/components/schemas/ChallengeCounts"
    ChallengeCounts:
      type: object
      required: [upcoming, ongoing, finished]
      additionalProperties: false
      description: |
        How many challenges of the requested `scope` have each status, at the
        instant the statuses of the page are: whatever the `status` filter and
        the cursor, with the visibility rules of the scope (a private
        challenge never counts in `public`). Their sum is every challenge of
        the scope.
      properties:
        upcoming:
          type: integer
          minimum: 0
        ongoing:
          type: integer
          minimum: 0
        finished:
          type: integer
          minimum: 0
    ParticipantPage:
      type: object
      required: [items, next_cursor]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Participant"
        next_cursor:
          type: string
          nullable: true
          description: Pass it as `cursor` for the next page; null on the last page.
    Participant:
      type: object
      required: [user_id, pseudo, first_name, last_name, avatar, status, is_creator, joined_at]
      additionalProperties: false
      properties:
        user_id:
          type: string
          format: uuid
        pseudo:
          type: string
          nullable: true
          allOf:
            - $ref: "#/components/schemas/Pseudo"
          description: Null until the user chooses one (a deleted account is never listed).
        first_name:
          type: string
          nullable: true
          allOf:
            - $ref: "#/components/schemas/PersonName"
          description: Null for an account that has not set it (a deleted account is never listed).
        last_name:
          type: string
          nullable: true
          allOf:
            - $ref: "#/components/schemas/PersonName"
          description: Null for an account that has not set it (a deleted account is never listed).
        avatar:
          type: string
          nullable: true
          description: |
            Avatar image; always null in V1, where the apps show the initials
            of the pseudo, or of the first and last names without one.
        status:
          type: string
          enum: [active, abandoned]
          description: "`abandoned` also covers an excluded participant. A deleted account is never listed."
        is_creator:
          type: boolean
          description: |
            Whether the participant is a creator of the challenge, initial or
            added since. A creator who abandoned stays one (true with status
            `abandoned`); an excluded participant never is (a creator cannot be
            excluded).
        joined_at:
          type: string
          format: date-time
    Leaderboard:
      type: object
      required: [computed_at, categories]
      additionalProperties: false
      properties:
        computed_at:
          type: string
          format: date-time
          description: The instant the ranking was computed at; the weeks locked at it are judged.
        categories:
          type: array
          description: The categories of the challenge, in their order.
          items:
            $ref: "#/components/schemas/CategoryRanking"
    CategoryRanking:
      type: object
      required: [type, ranked_count, podium, entries, me, next_cursor]
      additionalProperties: false
      properties:
        type:
          type: string
          enum: [cumulative_time, cumulative_distance, elimination, points, cumulative_elevation]
        exercise:
          type: string
          nullable: true
          description: |
            Elimination by repetitions only, the exercise whose repetitions
            count: the values, the minimum and the live status are then in
            repetitions (`EliminationProgress.repetitions`); absent or null
            for an elimination in meters and the other categories.
        ranked_count:
          type: integer
          minimum: 0
          description: |
            How many participants are ranked in the category, abandoned ones
            and deleted accounts left out: the `ranked_count` of `MyRanking`,
            frozen with the results once the challenge is over.
        podium:
          type: array
          nullable: true
          description: |
            With `limit`, the lines of ranks 1 to 3, equal ones included,
            with a value above 0 (a value of 0 is in `entries`); null without
            `limit`.
          items:
            $ref: "#/components/schemas/LeaderboardEntry"
        entries:
          type: array
          description: |
            Without `limit`, every participant but the deleted accounts; with
            `limit`, a page of the lines after the podium. Ranked ones first,
            best first; abandoned ones last. `value` is in seconds for
            `cumulative_time`, in meters for `cumulative_distance`,
            `elimination` (in repetitions for an elimination by repetitions,
            `exercise`) and `cumulative_elevation`, in points acquired for
            `points`.
          items:
            $ref: "#/components/schemas/LeaderboardEntry"
        me:
          type: object
          nullable: true
          allOf:
            - $ref: "#/components/schemas/LeaderboardEntry"
          description: |
            The line of the user in the category (abandoned included),
            wherever it is in the ranking; null when they are not a
            participant.
        next_cursor:
          type: string
          nullable: true
          description: The cursor of the next page of the category; null at the end, and without `limit`.
    PointsBreakdown:
      type: object
      required: [user_id, computed_at, abandoned, frozen, acquired_points, provisional_points, weeks]
      additionalProperties: false
      properties:
        user_id:
          type: string
          format: uuid
        computed_at:
          type: string
          format: date-time
          description: The instant the points were computed at (that of the frozen results once frozen).
        abandoned:
          type: boolean
          description: |
            The participant abandoned or was excluded; the leaderboard shows
            them without rank nor value.
        frozen:
          type: boolean
          description: The results of the challenge are frozen; the breakdown is theirs.
        acquired_points:
          type: integer
          minimum: 0
          description: The points of the locked weeks; the `value` of the leaderboard unless abandoned.
        provisional_points:
          type: integer
          minimum: 0
          nullable: true
          description: |
            The points of the weeks started but not locked yet, the
            `provisional_points` of the leaderboard; null once every started
            week is locked, for a participant who abandoned, and when frozen.
        weeks:
          type: array
          description: The weeks started, in order (see the operation).
          items:
            $ref: "#/components/schemas/PointsWeek"
    PointsWeek:
      type: object
      required: [number, starts_at, ends_at, locked, points, criteria]
      additionalProperties: false
      properties:
        number:
          type: integer
          minimum: 1
        starts_at:
          type: string
          format: date-time
          description: First instant of the week, in the time zone of the challenge (sent in UTC).
        ends_at:
          type: string
          format: date-time
          description: First instant after the week.
        locked:
          type: boolean
          description: |
            The week is locked (7 am, local time, on the first day of the next
            week): its points are acquired.
        points:
          type: integer
          minimum: 0
          description: The points of the week, the sum of its criteria.
        criteria:
          type: array
          description: Each criterion of the challenge, in its order.
          items:
            $ref: "#/components/schemas/PointsCriterion"
    PointsCriterion:
      type: object
      required: [criterion, rank, value, points]
      additionalProperties: false
      properties:
        criterion:
          type: string
          enum: [longest_duration, longest_distance, session_count, weekly_elevation, fastest_run]
        rank:
          type: integer
          minimum: 1
          nullable: true
          description: |
            The rank in the weekly ranking of the criterion, equal values
            sharing it (1, 1, 3), the lowest pace first for `fastest_run`;
            null without a value, which does not score: a value of 0, or no
            `run` session with a distance for `fastest_run` (a pace of 0 is
            a value).
        value:
          type: integer
          minimum: 0
          nullable: true
          description: |
            Seconds (`longest_duration`), equivalent meters
            (`longest_distance`), sessions (`session_count`), meters of
            elevation gain (`weekly_elevation`) or seconds per km
            (`fastest_run`). Null for a reader who may
            not see the activities of the participants (not a participant,
            abandoned ones included, a creator nor an admin: README §5.7);
            the rank and the points stay.
        points:
          type: integer
          minimum: 0
          description: The points of the scale for the rank (top 5 or top 10); 0 out of it.
    LeaderboardEntry:
      type: object
      required: [rank, user, value, abandoned, elimination, provisional_points]
      additionalProperties: false
      properties:
        rank:
          type: integer
          minimum: 1
          nullable: true
          description: Null for a participant who abandoned.
        user:
          $ref: "#/components/schemas/LeaderboardUser"
        value:
          type: integer
          minimum: 0
          nullable: true
          description: Null for a participant who abandoned.
        abandoned:
          type: boolean
        elimination:
          type: object
          nullable: true
          allOf:
            - $ref: "#/components/schemas/EliminationProgress"
          description: Only in the `elimination` category, and null for a participant who abandoned.
        provisional_points:
          type: integer
          minimum: 0
          nullable: true
          description: |
            Only in the `points` category: the points of the weeks started but
            not locked yet, not counted in `value` nor in the rank. Null in the
            other categories, for a participant who abandoned, once every
            started week is locked, and in the frozen results.
    LeaderboardUser:
      type: object
      required: [id, pseudo, first_name, last_name, avatar]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        pseudo:
          type: string
          nullable: true
          allOf:
            - $ref: "#/components/schemas/Pseudo"
          description: Null for an account that has not set it (a deleted account is never listed).
        first_name:
          type: string
          nullable: true
          allOf:
            - $ref: "#/components/schemas/PersonName"
          description: Null for an account that has not set it (a deleted account is never listed).
        last_name:
          type: string
          nullable: true
          allOf:
            - $ref: "#/components/schemas/PersonName"
          description: Null for an account that has not set it (a deleted account is never listed).
        avatar:
          type: string
          nullable: true
          description: |
            Avatar image; always null in V1, where the apps show the initials
            of the pseudo, or of the first and last names without one.
    EliminationProgress:
      type: object
      required: [status, eliminated_week, minimum_meters, distance_meters, week_ends_at]
      additionalProperties: false
      properties:
        status:
          type: string
          nullable: true
          enum: [reached, at_risk, in_progress, eliminated]
          description: Null in week 1 and outside the weeks of the challenge.
        eliminated_week:
          type: integer
          minimum: 2
          nullable: true
          description: The week the participant was eliminated in, judged when it locked; null if not eliminated.
        minimum_meters:
          type: integer
          minimum: 0
          nullable: true
          description: The distance the current week needs; null in week 1, when eliminated, or outside the weeks. Until the week before locks, it may still rise.
        distance_meters:
          type: integer
          minimum: 0
          description: The distance already covered in the reference sport in the current week; 0 when eliminated or outside the weeks, and in an elimination by repetitions.
        minimum_repetitions:
          type: integer
          minimum: 0
          nullable: true
          description: Elimination by repetitions only (absent otherwise), the repetitions the current week needs, as `minimum_meters` (then null).
        repetitions:
          type: integer
          minimum: 0
          description: Elimination by repetitions only (absent otherwise), the repetitions of the exercise already done in the current week, as `distance_meters` (then 0).
        week_ends_at:
          type: string
          format: date-time
          nullable: true
          description: The end of the current week; null when eliminated or outside the weeks.
    ChallengeSummary:
      type: object
      required: [id, title, visibility, timezone, reference_sport, exercise, starts_at, ends_at, participant_count, my_role, my_status, status, current_week, week_ends_at, week_count, my_week, best_result]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        visibility:
          type: string
          enum: [public, private]
        timezone:
          type: string
        reference_sport:
          type: string
          description: Code of the sport the distances are brought back to and the elimination is run in.
          example: ride
        exercise:
          type: string
          nullable: true
          description: |
            Code of the exercise of the elimination when it is by repetitions
            (`Sport.exercises`), as `CategoryRanking.exercise`; null otherwise
            (elimination in meters, or none). Whatever the scope and status.
          example: burpee
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        participant_count:
          type: integer
          description: Everyone who joined, abandoned included, deleted accounts left out.
        my_role:
          type: string
          enum: [creator, participant, abandoned, invited, outsider]
          description: The user's role in the challenge.
        my_status:
          type: string
          enum: [active, abandoned]
          nullable: true
          description: The user's participation; null when not a participant.
        status:
          type: string
          enum: [upcoming, ongoing, finished]
        week_count:
          type: integer
          minimum: 1
          description: Number of weeks of the challenge, whatever its status, as `week_count` of the detail.
        current_week:
          type: integer
          nullable: true
          minimum: 1
          description: |
            Number of the current week; null before the start and after the
            end. As `current_week` of the detail, for everyone, whatever
            `my_role` and `my_status`; equal to `my_week.week` when `my_week`
            is given.
        week_ends_at:
          type: string
          format: date-time
          nullable: true
          description: |
            End of the current week; null before the start and after the end.
            As `week_ends_at` of the detail, for everyone, whatever `my_role`
            and `my_status`; equal to `my_week.week_ends_at` when `my_week` is
            given.
        my_week:
          type: object
          nullable: true
          allOf:
            - $ref: "#/components/schemas/MyWeek"
          description: |
            Only in `mine`, for an ongoing challenge where the user is an
            active participant; null otherwise (`public`, upcoming or
            finished, abandoned).
        best_result:
          type: object
          nullable: true
          allOf:
            - $ref: "#/components/schemas/BestResult"
          description: |
            Only in `mine`, for a finished challenge whose results are frozen
            (at the lock of its last week) and where the user is an active
            participant ranked in at least one category; null otherwise
            (`public`, upcoming or ongoing, results not frozen yet, abandoned
            or excluded).
    BestResult:
      type: object
      required: [type, rank, ranked_count]
      additionalProperties: false
      description: |
        The user's best frozen rank among the categories of the challenge, as
        the leaderboard serves it once the challenge is over (deleted accounts
        left out, the others moving up). Between categories of the same rank,
        the first one in the order of the challenge's categories.
      properties:
        type:
          type: string
          enum: [cumulative_time, cumulative_distance, elimination, points, cumulative_elevation]
        rank:
          type: integer
          minimum: 1
          description: The user's rank in the category; equal values share it (1, 1, 3).
        ranked_count:
          type: integer
          minimum: 1
          description: How many participants are ranked in the category, abandoned ones and deleted accounts left out.
    MyWeek:
      type: object
      required: [week, week_ends_at, rankings]
      additionalProperties: false
      properties:
        week:
          type: integer
          minimum: 1
          description: Number of the current week.
        week_ends_at:
          type: string
          format: date-time
          description: End of the current week.
        rankings:
          type: array
          description: The user's line in each category of the challenge, in their order.
          items:
            $ref: "#/components/schemas/MyRanking"
    MyRanking:
      type: object
      required: [type, rank, ranked_count, elimination, provisional_points]
      additionalProperties: false
      properties:
        type:
          type: string
          enum: [cumulative_time, cumulative_distance, elimination, points, cumulative_elevation]
        rank:
          type: integer
          minimum: 1
          description: The user's rank, as in the leaderboard; equal values share it (1, 1, 3).
        ranked_count:
          type: integer
          minimum: 1
          description: How many participants are ranked in the category, abandoned ones and deleted accounts left out.
        elimination:
          type: object
          nullable: true
          allOf:
            - $ref: "#/components/schemas/EliminationProgress"
          description: Only in the `elimination` category, as in the leaderboard; null in the other categories.
        provisional_points:
          type: integer
          minimum: 0
          nullable: true
          description: |
            Only in the `points` category, as in the leaderboard: the points of
            the weeks started but not locked yet; null in the other categories
            and once every started week is locked.
    ChallengeDetail:
      type: object
      required: [id, title, description, visibility, members_can_invite, timezone, reference_sport, starts_at, ends_at, categories, participant_count, my_role, my_status, status, can_join, registration_deadline, current_week, week_ends_at, week_count, weeks]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
          nullable: true
        visibility:
          type: string
          enum: [public, private]
        members_can_invite:
          type: boolean
        timezone:
          type: string
        reference_sport:
          type: string
          description: Code of the sport the distances are brought back to and the elimination is run in.
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        categories:
          type: array
          description: The categories of the challenge, in their order.
          items:
            $ref: "#/components/schemas/Category"
        participant_count:
          type: integer
          description: Everyone who joined, abandoned included, deleted accounts left out.
        my_role:
          type: string
          enum: [creator, participant, abandoned, invited, outsider]
          description: The user's role in the challenge.
        my_status:
          type: string
          enum: [active, abandoned]
          nullable: true
          description: The user's participation; null when not a participant.
        status:
          type: string
          enum: [upcoming, ongoing, finished]
        can_join:
          type: boolean
          description: |
            Whether the user may join now (rights, before the end of week 1,
            not already a participant). The complete profile is checked apart
            (`profile_complete` of `GET /me`).
        registration_deadline:
          type: string
          format: date-time
          description: End of week 1, when joining closes.
        current_week:
          type: integer
          nullable: true
          minimum: 1
          description: Number of the current week; null before the start and after the end.
        week_ends_at:
          type: string
          format: date-time
          nullable: true
          description: End of the current week; null before the start and after the end.
        week_count:
          type: integer
          minimum: 1
          description: |
            Number of weeks of the challenge, whatever its status: the last
            value `current_week` takes. The last week may be shorter than 7
            days.
        weeks:
          type: array
          description: |
            The weeks of the challenge, in order, whatever its status: as many
            as `week_count`. Each one starts at local midnight in the
            challenge's time zone (the first instant of the day where a time
            change skips midnight), in UTC like `starts_at`; the last one may
            be shorter than 7 days and ends with the challenge. The current
            week ends at `week_ends_at`.
          items:
            $ref: "#/components/schemas/ChallengeWeek"
    ChallengeWeek:
      type: object
      required: [number, starts_at, ends_at]
      additionalProperties: false
      properties:
        number:
          type: integer
          minimum: 1
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
          description: Excluded, the start of the next week (or the end of the challenge).
    ChallengeUpdate:
      type: object
      additionalProperties: false
      properties:
        title:
          type: string
          description: |
            3 to 80 characters once surrounding spaces are removed, 3 of them
            visible (the kept formatting characters below do not count); checked
            by the service. No control character, no line or
            paragraph separator (U+2028, U+2029), no invisible or bidirectional
            formatting character (Unicode Cf, such as U+200B or U+202E) but
            U+200C, U+200D, U+200E, U+200F and the tags of flags (U+E0020 to
            U+E007F).
        description:
          type: string
          maxLength: 2000
          description: |
            2000 characters at most; an empty string removes the description.
            No control character but line breaks and tabs (line and paragraph
            separators U+2028 and U+2029 allowed too), no invisible or bidirectional
            formatting character (Unicode Cf, such as U+200B or U+202E) but
            U+200C, U+200D, U+200E, U+200F and the tags of flags (U+E0020 to
            U+E007F).
        visibility:
          description: Frozen at creation; sending it answers 422 `field_not_editable`, and `null` 400 `validation_failed`.
        members_can_invite:
          description: Frozen at creation; sending it answers 422 `field_not_editable`, and `null` 400 `validation_failed`.
        timezone:
          description: Frozen at creation; sending it answers 422 `field_not_editable`, and `null` 400 `validation_failed`.
        start_date:
          description: Frozen at creation; sending it answers 422 `field_not_editable`, and `null` 400 `validation_failed`.
        weeks:
          description: Frozen at creation; sending it answers 422 `field_not_editable`, and `null` 400 `validation_failed`.
        elimination_step_meters:
          description: |
            Former creation field, now `categories.elimination.step_meters`;
            kept so that a client still sending it is told the step is frozen:
            422 `field_not_editable`, and `null` 400 `validation_failed`.
        reference_sport:
          description: Frozen at creation; sending it answers 422 `field_not_editable`, and `null` 400 `validation_failed`.
        distance_factors:
          description: Frozen at creation; sending it answers 422 `field_not_editable`, and `null` 400 `validation_failed`.
        categories:
          description: Frozen at creation; sending it answers 422 `field_not_editable`, and `null` 400 `validation_failed`.
        starts_at:
          description: Frozen at creation; sending it answers 422 `field_not_editable`, and `null` 400 `validation_failed`.
        ends_at:
          description: Frozen at creation; sending it answers 422 `field_not_editable`, and `null` 400 `validation_failed`.
    CreatorAdd:
      type: object
      required: [user_id]
      additionalProperties: false
      properties:
        user_id:
          type: string
          format: uuid
          description: The participant to make a creator.
    InvitationCreated:
      type: object
      required: [token, expires_at]
      additionalProperties: false
      properties:
        token:
          type: string
          description: The token of the link, to send in the body of `POST /invitations/open` and `POST /invitations/accept`. Never answered again.
        expires_at:
          type: string
          format: date-time
          description: End of week 1 of the challenge, when the invitation expires.
    InvitationTokenRequest:
      description: |
        The token of an invitation link, in the body so that no URL carries
        it. No format is checked: a malformed token is an invalid invitation
        (404), never a 400; a missing or empty one is a 400.
      type: object
      required: [token]
      additionalProperties: false
      properties:
        token:
          type: string
          minLength: 1
    InvitationPreview:
      type: object
      required: [challenge_id, title, starts_at, ends_at]
      additionalProperties: false
      properties:
        challenge_id:
          type: string
          format: uuid
        title:
          type: string
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
    ActivityCreate:
      type: object
      required: [sport_code, started_at, duration_seconds]
      additionalProperties: false
      properties:
        sport_code:
          type: string
          description: |
            Code of a sport of the catalogue (`GET /api/v1/sports`): a
            lowercase letter, then lowercase letters, digits or `_`, as the
            catalogue allows (constraint `sports_code_check`).
          pattern: "^[a-z][a-z0-9_]{0,31}$"
          example: run
        sport_label:
          type: string
          maxLength: 200
          description: |
            Free label of the sport `other`, required for it and refused for
            the others: 2 to 40 characters once spaces are cleaned, 2 of them
            visible (the kept formatting characters below do not count), no
            control character, no line or
            paragraph separator (U+2028, U+2029), no invisible or bidirectional
            formatting character (Unicode Cf, such as U+200B or U+202E) but
            U+200C, U+200D, U+200E, U+200F and the tags of flags (U+E0020 to
            U+E007F).
        started_at:
          type: string
          format: date-time
          description: |
            Start of the activity; never before 2000-01-01T00:00:00Z, and the
            activity is entered once done: its end (`started_at` plus
            `duration_seconds`) is never in the future either (5 minutes of
            tolerance).
        duration_seconds:
          type: integer
          minimum: 1
          maximum: 86400
        distance_meters:
          type: integer
          minimum: 1
          maximum: 1000000
          description: Required or refused according to the sport's `distance_mode`.
        elevation_gain_meters:
          type: integer
          minimum: 0
          maximum: 20000
          description: |
            Positive elevation gain in meters, optional; it counts for the
            `cumulative_elevation` category and the `weekly_elevation`
            criterion of the `points` category, and for nothing else (no
            badge). Refused (`elevation_not_allowed`)
            when the sport's `elevation_allowed` is false or the activity has
            no distance. On a change, leaving it out removes it.
        repetitions:
          type: array
          maxItems: 50
          description: |
            Repetitions by exercise, optional; they count for the elimination
            by repetitions only. Each exercise once, and one of a challenge of
            the user with an elimination by repetitions, whose reference
            sport is `sport_code`, where they are an active participant and
            whose window holds `started_at` (`unknown_exercise` otherwise).
            A change replaces them all, as the other fields: left out, they
            are removed; those of an exercise already on the activity are
            kept even when no challenge offers it any more.
          items:
            $ref: "#/components/schemas/ActivityRepetitions"
    ActivityRepetitions:
      type: object
      required: [exercise, repetitions]
      additionalProperties: false
      properties:
        exercise:
          type: string
          pattern: "^[a-z][a-z0-9_]{0,31}$"
          description: Code of an exercise of the catalogue (`Sport.exercises`).
          example: burpee
        repetitions:
          type: integer
          minimum: 0
          maximum: 10000
          description: Repetitions of the exercise in the activity, 0 to 10,000.
    Activity:
      type: object
      required: [id, sport_code, sport_label, started_at, duration_seconds, distance_meters, elevation_gain_meters, source, speed_mps, pace_seconds_per_km, contributions, locked]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        sport_code:
          type: string
        sport_label:
          type: string
          nullable: true
          description: Label of the sport `other`, cleaned; null for the others.
        started_at:
          type: string
          format: date-time
        duration_seconds:
          type: integer
        distance_meters:
          type: integer
          nullable: true
        elevation_gain_meters:
          type: integer
          nullable: true
          description: Positive elevation gain in meters; null when not entered.
        source:
          type: string
          enum: [manual]
        speed_mps:
          type: number
          format: double
          nullable: true
          description: Speed in meters per second, computed; null without distance.
        pace_seconds_per_km:
          type: number
          format: double
          nullable: true
          description: Pace in seconds per kilometer, computed; null without distance.
        contributions:
          type: array
          description: |
            What the activity brings, now, to each challenge where it counts;
            possibly empty. A deleted challenge never appears.
          items:
            $ref: "#/components/schemas/ActivityContribution"
        repetitions:
          type: array
          description: |
            Every repetitions of the activity by exercise, sorted by
            exercise, those of an exercise no challenge offers any more
            included; absent when none.
          items:
            $ref: "#/components/schemas/ActivityRepetitions"
        locked:
          type: boolean
          description: |
            True once the week of the activity is locked in a challenge where
            it counts, at 7 am, local time of the challenge, on the first day
            of the next week, or was already locked when the user left a
            challenge (abandoned or excluded): it can no longer be changed nor
            deleted.
    ActivityContribution:
      type: object
      required: [challenge_id, challenge_title, distance_meters, duration_seconds]
      additionalProperties: false
      properties:
        challenge_id:
          type: string
          format: uuid
        challenge_title:
          type: string
        distance_meters:
          type: integer
          nullable: true
          description: |
            The distance brought to the cumulative distance category: the
            distance times the factor of the sport in this challenge, rounded
            to the meter (half up) as the ranking rounds a total. Null when
            the challenge has no cumulative distance category, the sport no
            factor in this challenge, or the activity no distance. The ranking rounds the total once, so it may differ by
            a meter or so from the sum of these values.
        duration_seconds:
          type: integer
          description: The duration brought to the cumulative time category.
    ActivityPage:
      type: object
      required: [items, next_cursor]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Activity"
        next_cursor:
          type: string
          nullable: true
          description: Pass it as `cursor` for the next page; null on the last page.
    ActivityWeek:
      type: object
      required: [starts_at, ends_at, sessions, duration_seconds, distance_meters, elevation_gain_meters]
      additionalProperties: false
      properties:
        starts_at:
          type: string
          format: date-time
          description: Monday 00:00 in `tz`.
        ends_at:
          type: string
          format: date-time
          description: Excluded, the next Monday 00:00 in `tz`.
        sessions:
          type: integer
          minimum: 0
          description: Number of activities started in the week.
        duration_seconds:
          type: integer
          minimum: 0
        distance_meters:
          type: integer
          minimum: 0
          description: Sum of the distances entered; an activity without distance adds 0.
        elevation_gain_meters:
          type: integer
          minimum: 0
          description: Sum of the elevation gains entered, over the same activities as `distance_meters`; an activity without one adds 0.
    ActivityWeekPage:
      type: object
      required: [items, next_cursor]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ActivityWeek"
        next_cursor:
          type: string
          nullable: true
          description: Pass it as `cursor` for the next page; null on the last page.
    ActivityDay:
      type: object
      required: [date, sessions, duration_seconds]
      additionalProperties: false
      properties:
        date:
          type: string
          format: date
          description: Local day in `tz`.
        sessions:
          type: integer
          minimum: 0
        duration_seconds:
          type: integer
          minimum: 0
    CurrentActivityWeek:
      type: object
      required: [starts_at, ends_at, sessions, duration_seconds, distance_meters, elevation_gain_meters, days]
      additionalProperties: false
      properties:
        starts_at:
          type: string
          format: date-time
          description: Monday 00:00 in `tz`.
        ends_at:
          type: string
          format: date-time
          description: Excluded, the next Monday 00:00 in `tz`.
        sessions:
          type: integer
          minimum: 0
        duration_seconds:
          type: integer
          minimum: 0
        distance_meters:
          type: integer
          minimum: 0
          description: Sum of the distances entered; an activity without distance adds 0.
        elevation_gain_meters:
          type: integer
          minimum: 0
          description: Sum of the elevation gains entered, over the same activities as `distance_meters`; an activity without one adds 0.
        days:
          type: array
          description: The 7 days of the week, Monday to Sunday, empty ones included.
          minItems: 7
          maxItems: 7
          items:
            $ref: "#/components/schemas/ActivityDay"
    SportCount:
      type: object
      required: [sport_code, count]
      additionalProperties: false
      properties:
        sport_code:
          type: string
          description: Code of the catalogue; every activity of the sport `other` counts under `other`, whatever its label.
        count:
          type: integer
          minimum: 1
    ActivitySummary:
      type: object
      required: [current_week, sports, total, total_duration_seconds, challenge_count]
      additionalProperties: false
      properties:
        current_week:
          $ref: "#/components/schemas/CurrentActivityWeek"
        challenge_count:
          type: integer
          minimum: 0
          description: |
            Number of challenges I joined, whatever their status (upcoming,
            ongoing, finished), those I abandoned or was excluded from
            included; not those I only created without taking part, nor the
            deleted ones.
        sports:
          type: array
          description: The sports of my activities, most frequent first (then by code).
          items:
            $ref: "#/components/schemas/SportCount"
        total:
          type: integer
          minimum: 0
          description: Number of my activities, the sum of the counts of `sports`.
        total_duration_seconds:
          type: integer
          minimum: 0
          description: Sum of the durations of the activities counted in `total`; 0 without any.
    ChallengeActivity:
      type: object
      description: |
        An activity in the list of a challenge: the fields of `Activity`,
        `contributions` and `locked` read from this challenge only, plus its
        author.
      required: [id, sport_code, sport_label, started_at, duration_seconds, distance_meters, elevation_gain_meters, source, speed_mps, pace_seconds_per_km, contributions, locked, user]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        sport_code:
          type: string
        sport_label:
          type: string
          nullable: true
          description: Label of the sport `other`, cleaned; null for the others.
        started_at:
          type: string
          format: date-time
        duration_seconds:
          type: integer
        distance_meters:
          type: integer
          nullable: true
        elevation_gain_meters:
          type: integer
          nullable: true
          description: Positive elevation gain in meters; null when not entered.
        source:
          type: string
          enum: [manual]
        speed_mps:
          type: number
          format: double
          nullable: true
          description: Speed in meters per second, computed; null without distance.
        pace_seconds_per_km:
          type: number
          format: double
          nullable: true
          description: Pace in seconds per kilometer, computed; null without distance.
        contributions:
          type: array
          description: |
            What the activity brings, now, to this challenge when it counts
            in it: at most one item, none for an author who abandoned.
          items:
            $ref: "#/components/schemas/ActivityContribution"
        locked:
          type: boolean
          description: |
            True once the week of the activity is locked in this challenge,
            where it counts, at 7 am, local time of the challenge, on the
            first day of the next week; for an author who abandoned, only
            when the week was already locked when they left.
        repetitions:
          type: array
          description: |
            As `Activity.repetitions`: every one, sorted by exercise, those of
            an exercise this challenge does not offer included; absent when none.
          items:
            $ref: "#/components/schemas/ActivityRepetitions"
        user:
          $ref: "#/components/schemas/LeaderboardUser"
    ChallengeActivityPage:
      type: object
      required: [items, next_cursor]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ChallengeActivity"
        next_cursor:
          type: string
          nullable: true
          description: Pass it as `cursor` for the next page; null on the last page.
