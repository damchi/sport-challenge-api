          type: boolean
          description: Preview the change, writing nothing. `false` when absent.
        title:
          type: string
          description: As at creation.
        description:
          type: string
          maxLength: 2000
          description: As at creation; an empty string removes it.
        visibility:
          type: string
          enum: [public, private]
        members_can_invite:
          type: boolean
