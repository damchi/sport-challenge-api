# Redocly lint exceptions, one entry per justified case.
openapi.yaml:
  # Health probes never answer 4xx.
  operation-4xx-response:
    - '#/paths/~1healthz/get/responses'
    - '#/paths/~1readyz/get/responses'
  # Shared 401 response, referenced by the first protected route (SC-API-021).
  no-unused-components:
    - '#/components/responses/Unauthorized'
